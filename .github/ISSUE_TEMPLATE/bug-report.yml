name: Bug report
description: Something in the toolkit, setup, or an example does not work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the full error message.
    validations:
      required: true
  - type: textarea
    id: envcheck
    attributes:
      label: Output of `python -m statsbench.envcheck`
      render: text
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options: [GitHub Codespaces, Binder, Windows, macOS, Linux, Google Colab, Other]
