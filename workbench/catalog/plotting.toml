id = "qqplot"
title = "Normal Q-Q plot of residuals"
kind = "visualize"
library = "statsmodels"
import = "import statsmodels.api as sm"
call = "sm.qqplot(model.resid, line='45', fit=True)"
aliases = ["quantile quantile plot", "normality of residuals", "qq plot"]
r = ["qqnorm", "qqline"]
inputs = "1-D residuals."
returns = "Figure."
example = '''
import matplotlib.pyplot as plt
import numpy as np
import statsmodels.api as sm

residuals = np.random.default_rng(29).normal(size=100)
fig = sm.qqplot(residuals, line="45", fit=True)
plt.close(fig)
'''
see_also = ["ols-diagnostics"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.graphics.gofplots.qqplot.html"

[[entry]]
id = "plot-tree"
title = "Draw a fitted decision tree"
kind = "visualize"
library = "scikit-learn"
import = "from sklearn.tree import plot_tree"
call = "plot_tree(tree, feature_names=[...], filled=True)"
aliases = ["tree diagram", "visualize tree"]
r = ["rpart.plot::rpart.plot", "plot(tree); text(tree)"]
inputs = "Fitted tree."
returns = "List of annotation artists."
example = '''
import matplotlib.pyplot as plt
import numpy as np
from sklearn.tree import DecisionTreeRegressor, plot_tree

rng = np.random.default_rng(30)
X = rng.uniform(0, 10, size=(80, 2))
y = X[:, 0] + rng.normal(size=80)
tree = DecisionTreeRegressor(max_depth=2).fit(X, y)
fig, ax = plt.subplots(figsize=(8, 4))
plot_tree(tree, feature_names=["x1", "x2"], filled=True, ax=ax)
plt.close(fig)
'''
see_also = ["tree-regressor"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.tree.plot_tree.html"
