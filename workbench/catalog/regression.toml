# Topic: regression -- linear models with inference (statsmodels).
# Key distinction: statsmodels = coefficients WITH standard errors and tests (like R's lm + summary).
# Schema and how to add entries: docs/adding-a-topic.md

[[entry]]
id = "smf-ols"
title = "Fit a linear regression with an R-style formula and full summary"
kind = "fit"
library = "statsmodels"
import = "import statsmodels.formula.api as smf"
call = "smf.ols('y ~ x1 + x2', data=df).fit()"
aliases = ["linear regression", "lm", "ordinary least squares", "coefficient summary", "regression table", "multiple regression"]
r = ["lm", "summary.lm"]
inputs = "Formula string; DataFrame containing the named columns."
returns = "RegressionResults: .params, .bse, .pvalues, .rsquared, .summary(), .predict()."
example = '''
import numpy as np
import pandas as pd
import statsmodels.formula.api as smf

rng = np.random.default_rng(0)
df = pd.DataFrame({"x1": rng.normal(size=100), "x2": rng.normal(size=100)})
df["y"] = 1 + 2 * df["x1"] - 0.5 * df["x2"] + rng.normal(scale=0.5, size=100)
model = smf.ols("y ~ x1 + x2", data=df).fit()
print(model.summary())
print(model.params["x1"], model.bse["x1"], model.pvalues["x1"])
'''
caveats = [
    "Formula interface adds the intercept automatically (like R). sm.OLS(y, X) does NOT; use sm.add_constant(X).",
    "C(g) marks a categorical predictor; I(x**2) protects arithmetic inside a formula (R uses I(x^2)).",
    "The formula language is patsy/formulaic, very close to R but without the '.' shorthand.",
]
see_also = ["ols-predict", "ols-t-test", "anova-lm", "sk-linear-regression", "glm-binomial"]
docs = "https://www.statsmodels.org/stable/example_formulas.html"

[[entry]]
id = "sm-ols-matrix"
title = "Linear regression from arrays (matrix interface) with explicit intercept"
kind = "fit"
library = "statsmodels"
import = "import statsmodels.api as sm"
call = "sm.OLS(y, sm.add_constant(X)).fit()"
aliases = ["add intercept column", "add constant", "ols without formula"]
r = ["lm.fit", "lm(y ~ X)"]
inputs = "y (n,), X (n, p) array or DataFrame."
returns = "RegressionResults."
example = '''
import numpy as np
import statsmodels.api as sm

rng = np.random.default_rng(1)
X = rng.normal(size=(50, 2))
y = 3 + X @ np.array([1.0, -1.0]) + rng.normal(size=50)
model = sm.OLS(y, sm.add_constant(X)).fit()
print(model.params)            # const, x1, x2
'''
caveats = ["Forgetting add_constant silently fits a model through the origin."]
see_also = ["smf-ols"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.regression.linear_model.OLS.html"

[[entry]]
id = "ols-predict"
title = "Predictions with confidence and prediction intervals"
kind = "evaluate"
library = "statsmodels"
import = "import statsmodels.formula.api as smf"
call = "model.get_prediction(new_df).summary_frame(alpha=0.05)"
aliases = ["predict new data", "prediction interval", "confidence interval for mean response", "newdata"]
r = ["predict.lm", "predict(model, newdata, interval = 'prediction')"]
inputs = "Fitted results; DataFrame with the same predictor columns."
returns = "DataFrame: mean, mean_ci_lower/upper (confidence), obs_ci_lower/upper (prediction)."
example = '''
import numpy as np
import pandas as pd
import statsmodels.formula.api as smf

rng = np.random.default_rng(2)
df = pd.DataFrame({"x": rng.uniform(0, 10, 60)})
df["y"] = 2 + 0.5 * df["x"] + rng.normal(size=60)
model = smf.ols("y ~ x", data=df).fit()
new_df = pd.DataFrame({"x": [2.0, 8.0]})
print(model.get_prediction(new_df).summary_frame(alpha=0.05))
'''
see_also = ["smf-ols"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.regression.linear_model.RegressionResults.get_prediction.html"

[[entry]]
id = "ols-t-test"
title = "Hypothesis tests on coefficients (single and joint)"
kind = "evaluate"
library = "statsmodels"
import = "import statsmodels.formula.api as smf"
call = "model.t_test('x1 = 0.5') ; model.f_test('x1 = 0, x2 = 0')"
aliases = ["linear hypothesis", "test coefficient equals value", "joint f test", "wald test"]
r = ["car::linearHypothesis"]
inputs = "Fitted results; restriction string using coefficient names."
returns = "ContrastResults with statistic and pvalue."
example = '''
import numpy as np
import pandas as pd
import statsmodels.formula.api as smf

rng = np.random.default_rng(3)
df = pd.DataFrame({"x1": rng.normal(size=80), "x2": rng.normal(size=80)})
df["y"] = 0.5 * df["x1"] + rng.normal(size=80)
model = smf.ols("y ~ x1 + x2", data=df).fit()
print(model.t_test("x1 = 0.5"))
print(model.f_test("x1 = 0, x2 = 0"))
'''
see_also = ["smf-ols", "anova-lm"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.regression.linear_model.RegressionResults.t_test.html"

[[entry]]
id = "anova-lm"
title = "Compare nested linear models (F test) / ANOVA table"
kind = "evaluate"
library = "statsmodels"
import = "from statsmodels.stats.anova import anova_lm"
call = "anova_lm(small_model, large_model)"
aliases = ["nested model comparison", "anova", "partial f test", "compare models"]
r = ["anova"]
inputs = "Fitted OLS results, smallest model first, same rows."
returns = "DataFrame with F statistic and Pr(>F)."
example = '''
import numpy as np
import pandas as pd
import statsmodels.formula.api as smf
from statsmodels.stats.anova import anova_lm

rng = np.random.default_rng(4)
df = pd.DataFrame({"x1": rng.normal(size=80), "x2": rng.normal(size=80)})
df["y"] = df["x1"] + rng.normal(size=80)
small = smf.ols("y ~ x1", data=df).fit()
large = smf.ols("y ~ x1 + x2", data=df).fit()
print(anova_lm(small, large))
'''
caveats = ["anova_lm(model, typ=2) gives Type II sums of squares; R's anova() is sequential (Type I, typ=1)."]
see_also = ["smf-ols", "ols-t-test"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.stats.anova.anova_lm.html"

[[entry]]
id = "ols-diagnostics"
title = "Regression diagnostics: leverage, Cook's distance, VIF"
kind = "evaluate"
library = "statsmodels"
import = "from statsmodels.stats.outliers_influence import OLSInfluence, variance_inflation_factor"
call = "OLSInfluence(model).summary_frame()"
aliases = ["hat values", "leverage", "cooks distance", "influential points", "vif", "multicollinearity", "residual plots"]
r = ["hatvalues", "cooks.distance", "car::vif", "plot.lm"]
inputs = "Fitted OLS results."
returns = "DataFrame of per-observation influence measures."
example = '''
import numpy as np
import pandas as pd
import statsmodels.formula.api as smf
from statsmodels.stats.outliers_influence import OLSInfluence, variance_inflation_factor

rng = np.random.default_rng(5)
df = pd.DataFrame({"x1": rng.normal(size=40)})
df["x2"] = df["x1"] + rng.normal(scale=0.3, size=40)
df["y"] = df["x1"] + rng.normal(size=40)
model = smf.ols("y ~ x1 + x2", data=df).fit()
influence = OLSInfluence(model).summary_frame()
print(influence[["hat_diag", "cooks_d"]].head())
X = model.model.exog
print([variance_inflation_factor(X, i) for i in range(1, X.shape[1])])
'''
see_also = ["smf-ols", "qqplot"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.stats.outliers_influence.OLSInfluence.html"

[[entry]]
id = "sk-linear-regression"
title = "Linear regression for prediction pipelines (no p-values)"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.linear_model import LinearRegression"
call = "LinearRegression().fit(X, y)"
aliases = ["linear regression sklearn", "predictive linear model", "fit predict"]
r = ["lm"]
inputs = "X (n, p) array/DataFrame, y (n,)."
returns = "Fitted estimator: .coef_, .intercept_, .predict(X)."
example = '''
import numpy as np
from sklearn.linear_model import LinearRegression

rng = np.random.default_rng(6)
X = rng.normal(size=(100, 3))
y = 1 + X @ np.array([2.0, 0.0, -1.0]) + rng.normal(size=100)
model = LinearRegression().fit(X, y)
print(model.intercept_, model.coef_)
'''
caveats = ["Same estimates as smf-ols, but no standard errors; choose statsmodels for inference, sklearn for CV/pipelines."]
see_also = ["smf-ols", "cross-val-score", "mse"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.linear_model.LinearRegression.html"

[[entry]]
id = "ridge-lasso"
title = "Ridge and lasso (regularized regression) with CV-chosen penalty"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.linear_model import LassoCV, RidgeCV"
call = "make_pipeline(StandardScaler(), LassoCV(cv=5)).fit(X, y)"
aliases = ["glmnet", "lasso", "ridge regression", "shrinkage", "regularization", "l1 penalty", "l2 penalty", "elastic net"]
r = ["glmnet::cv.glmnet", "glmnet::glmnet"]
inputs = "X, y; alphas grid optional."
returns = "Fitted estimator with .alpha_ (chosen penalty) and .coef_."
example = '''
import numpy as np
from sklearn.linear_model import LassoCV
from sklearn.pipeline import make_pipeline
from sklearn.preprocessing import StandardScaler

rng = np.random.default_rng(7)
X = rng.normal(size=(120, 8))
y = X[:, 0] * 3 - X[:, 1] * 2 + rng.normal(size=120)
pipe = make_pipeline(StandardScaler(), LassoCV(cv=5, random_state=0)).fit(X, y)
lasso = pipe.named_steps["lassocv"]
print(lasso.alpha_, np.round(lasso.coef_, 3))
'''
caveats = [
    "sklearn's alpha is glmnet's lambda. glmnet standardizes X internally; sklearn does NOT, so add StandardScaler.",
    "Ridge objective scaling differs from glmnet (no 1/(2n) factor), so numeric alpha values are not interchangeable.",
]
see_also = ["sk-pipeline", "cross-val-score"]
docs = "https://scikit-learn.org/stable/modules/linear_model.html#lasso"
