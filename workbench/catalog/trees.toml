# Topic: trees -- regression/classification trees, pruning, and ensembles (scikit-learn).
# Key distinction: a tree's prediction is the MEAN (or majority) of training y in the leaf.
# Schema and how to add entries: docs/adding-a-topic.md

[[entry]]
id = "tree-regressor"
title = "Regression tree: fit, read the splits, predict"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.tree import DecisionTreeRegressor, export_text"
call = "DecisionTreeRegressor(max_depth=2).fit(X, y) ; export_text(tree, feature_names=[...])"
aliases = ["regression tree", "tree", "cart", "recursive partitioning", "tree splits", "leaf mean prediction"]
r = ["rpart::rpart", "tree::tree"]
inputs = "X (n, p), numeric y; max_depth / min_samples_leaf / ccp_alpha."
returns = "Fitted tree: .predict, .apply (leaf id), .tree_ internals."
example = '''
import numpy as np
from sklearn.tree import DecisionTreeRegressor, export_text

rng = np.random.default_rng(19)
X = rng.uniform(0, 10, size=(100, 2))
y = np.where(X[:, 0] < 4, 1.0, 5.0) + rng.normal(scale=0.2, size=100)
tree = DecisionTreeRegressor(max_depth=2, random_state=0).fit(X, y)
print(export_text(tree, feature_names=["x1", "x2"]))
print(tree.predict([[2.0, 5.0], [8.0, 5.0]]))
'''
caveats = [
    "Split rule is 'feature <= threshold' goes LEFT. Thresholds are midpoints between sorted training values.",
    "sklearn grows until pure/limited by default (no pruning); rpart prunes with cp=0.01 by default.",
    "Categorical predictors must be encoded (one-hot) first.",
]
see_also = ["tree-pruning", "tree-classifier", "cross-val-score", "plot-tree"]
recipe = "examples/05_regression_tree.py"
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeRegressor.html"

[[entry]]
id = "tree-classifier"
title = "Classification tree"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.tree import DecisionTreeClassifier"
call = "DecisionTreeClassifier(max_depth=3, criterion='gini').fit(X, y)"
aliases = ["classification tree", "gini impurity", "entropy split", "decision tree classifier"]
r = ["rpart::rpart(method = 'class')"]
inputs = "X, class labels y."
returns = "Fitted tree with .predict / .predict_proba."
example = '''
import numpy as np
from sklearn.tree import DecisionTreeClassifier, export_text

rng = np.random.default_rng(20)
X = rng.normal(size=(200, 2))
y = (X[:, 0] + X[:, 1] > 0).astype(int)
tree = DecisionTreeClassifier(max_depth=2, random_state=0).fit(X, y)
print(export_text(tree, feature_names=["x1", "x2"]))
'''
see_also = ["tree-regressor", "random-forest"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.tree.DecisionTreeClassifier.html"

[[entry]]
id = "tree-pruning"
title = "Cost-complexity pruning path (choose alpha)"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.tree import DecisionTreeRegressor"
call = "DecisionTreeRegressor().cost_complexity_pruning_path(X, y).ccp_alphas"
aliases = ["prune tree", "cost complexity", "cp table", "weakest link pruning"]
r = ["rpart::prune", "printcp", "tree::cv.tree"]
inputs = "Training X, y."
returns = "Object with ccp_alphas and impurities; refit with ccp_alpha=value."
example = '''
import numpy as np
from sklearn.model_selection import cross_val_score
from sklearn.tree import DecisionTreeRegressor

rng = np.random.default_rng(21)
X = rng.uniform(0, 10, size=(150, 1))
y = np.sin(X[:, 0]) + rng.normal(scale=0.3, size=150)
path = DecisionTreeRegressor(random_state=0).cost_complexity_pruning_path(X, y)
alphas = path.ccp_alphas[::10]
cv_mse = [-cross_val_score(DecisionTreeRegressor(ccp_alpha=a, random_state=0), X, y, cv=5,
                            scoring="neg_mean_squared_error").mean() for a in alphas]
print(alphas[int(np.argmin(cv_mse))])
'''
caveats = ["sklearn's ccp_alpha is on the impurity (MSE) scale; rpart's cp is relative to the root error, so values are not interchangeable."]
see_also = ["tree-regressor", "cross-val-score"]
docs = "https://scikit-learn.org/stable/auto_examples/tree/plot_cost_complexity_pruning.html"

[[entry]]
id = "random-forest"
title = "Random forest and gradient boosting"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.ensemble import GradientBoostingRegressor, RandomForestRegressor"
call = "RandomForestRegressor(n_estimators=500, max_features=1/3).fit(X, y)"
aliases = ["bagging", "random forest", "boosting", "gbm", "ensemble of trees", "variable importance"]
r = ["randomForest::randomForest", "gbm::gbm", "xgboost"]
inputs = "X, y; n_estimators, max_features, learning_rate (boosting)."
returns = "Fitted ensemble; .feature_importances_."
example = '''
import numpy as np
from sklearn.ensemble import GradientBoostingRegressor, RandomForestRegressor

rng = np.random.default_rng(22)
X = rng.normal(size=(200, 4))
y = X[:, 0] ** 2 + X[:, 1] + rng.normal(scale=0.3, size=200)
forest = RandomForestRegressor(n_estimators=200, max_features=1/3, random_state=0).fit(X, y)
boost = GradientBoostingRegressor(random_state=0).fit(X, y)
print(forest.feature_importances_.round(3), boost.feature_importances_.round(3))
'''
caveats = ["randomForest's regression default mtry = p/3; sklearn's default max_features=1.0 (all features = bagging). Set it explicitly."]
see_also = ["tree-regressor"]
docs = "https://scikit-learn.org/stable/modules/ensemble.html"
