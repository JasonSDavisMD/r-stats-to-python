# Topic: selection -- train/test error, cross-validation, subset selection, pipelines.
# Key distinction: training error measures fit; test/CV error estimates prediction.
# Schema and how to add entries: docs/adding-a-topic.md

[[entry]]
id = "train-test-split"
title = "Split data into training and test sets"
kind = "compute"
library = "scikit-learn"
import = "from sklearn.model_selection import train_test_split"
call = "train_test_split(X, y, test_size=0.25, random_state=0)"
aliases = ["holdout set", "test set", "validation split", "random split"]
r = ["sample(nrow(df), ...)", "caret::createDataPartition"]
inputs = "Arrays/DataFrames with the same number of rows."
returns = "X_train, X_test, y_train, y_test (in that order)."
example = '''
import numpy as np
from sklearn.model_selection import train_test_split

X = np.arange(20).reshape(10, 2)
y = np.arange(10)
X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, random_state=0)
print(X_train.shape, X_test.shape)
'''
caveats = ["If the course specifies which rows are training rows, use those rows; do not re-split randomly."]
see_also = ["mse", "cross-val-score"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.train_test_split.html"

[[entry]]
id = "mse"
title = "Mean squared error (train or test MSE)"
kind = "evaluate"
library = "scikit-learn"
import = "from sklearn.metrics import mean_squared_error"
call = "mean_squared_error(y_true, y_pred)"
aliases = ["test mse", "train mse", "prediction error", "rmse", "residual sum of squares"]
r = ["mean((y - yhat)^2)"]
inputs = "Observed and predicted values."
returns = "float."
example = '''
import numpy as np
from sklearn.metrics import mean_squared_error

y_true = np.array([3.0, 5.0, 2.0])
y_pred = np.array([2.5, 5.0, 3.0])
mse = mean_squared_error(y_true, y_pred)
print(mse, np.sqrt(mse))
assert np.isclose(mse, np.mean((y_true - y_pred) ** 2))
'''
caveats = ["RSS = n * MSE. Some texts define MSE with n - p in the denominator (an unbiased variance estimate); read the question."]
see_also = ["best-subset", "train-test-split"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.metrics.mean_squared_error.html"

