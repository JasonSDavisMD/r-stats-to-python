id = "betareg"
title = "Beta regression for proportions / rates strictly between 0 and 1"
kind = "fit"
library = "statsmodels"
import = "from statsmodels.othermod.betareg import BetaModel"
call = "BetaModel.from_formula('y ~ x', data=df).fit()"
aliases = ["beta regression", "regression for proportions", "percentage outcome regression", "fractional response 0 1", "betareg", "rate between 0 and 1"]
r = ["betareg::betareg", "betareg(y ~ x)"]
inputs = "Formula; DataFrame with response strictly inside (0, 1); optional exog_precision for a precision sub-model (R: y ~ x | z)."
returns = "BetaResults: .params (mean-model coefs on logit scale plus 'precision' on log scale), .bse, .summary(), .predict()."
example = '''
import numpy as np
import pandas as pd
from scipy.special import expit
from statsmodels.othermod.betareg import BetaModel

rng = np.random.default_rng(22)
df = pd.DataFrame({"fertilizer": rng.normal(size=300)})
mean_share = expit(0.3 + 0.8 * df["fertilizer"])
phi = 20.0
df["germination_rate"] = rng.beta(mean_share * phi, (1 - mean_share) * phi)

model = BetaModel.from_formula("germination_rate ~ fertilizer", data=df).fit(disp=False)
print(model.params.round(3).to_dict())
print("phi (R's (phi)) =", round(np.exp(model.params["precision"]), 2))
assert abs(model.params["fertilizer"] - 0.8) < 0.15
'''
caveats = [
    "The precision parameter is reported on the LOG scale ('precision'); exp() it to compare with betareg's phi (betareg's default phi link is identity).",
    "Exact 0 or 1 values are not allowed (same as betareg); squeeze with (y * (n - 1) + 0.5) / n first.",
]
see_also = ["glm-binomial", "negbin-glm"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.othermod.betareg.BetaModel.html"

