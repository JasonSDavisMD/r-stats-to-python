id = "glm-gam"
title = "Generalized additive model (GAM) with penalized B-spline smooths"
kind = "fit"
library = "statsmodels"
import = "from statsmodels.gam.api import BSplines, GLMGam"
call = "GLMGam.from_formula('y ~ z', data=df, smoother=BSplines(df[['x']], df=[12], degree=[3]), alpha=[1.0]).fit()"
aliases = ["gam", "generalized additive model", "mgcv", "smooth term", "s(x)", "penalized spline regression", "additive model", "nonlinear smooth effect"]
r = ["mgcv::gam", "gam(y ~ z + s(x))"]
inputs = "Formula for the linear (parametric) part; DataFrame; smoother=BSplines(columns to smooth, df=[basis size per column], degree=[3]); alpha= penalty weight per smooth; family= (Gaussian default)."
returns = "GLMGamResults: .params (linear part then spline coefs), .edf (effective df per coefficient), .fittedvalues, .plot_partial(i)."
example = '''
import numpy as np
import pandas as pd
from statsmodels.gam.api import BSplines, GLMGam

rng = np.random.default_rng(23)
df = pd.DataFrame({"temperature": np.sort(rng.uniform(0, 10, 200))})
df["yield_"] = np.sin(df["temperature"]) + rng.normal(scale=0.3, size=200)

splines = BSplines(df[["temperature"]], df=[12], degree=[3])
gam_model = GLMGam.from_formula("yield_ ~ 1", data=df, smoother=splines, alpha=np.array([1.0]))
alpha_grid = [np.logspace(-2, 3, 11)]                 # one grid per smooth term
best_alpha, _ = gam_model.select_penweight_kfold(alphas=alpha_grid, k_folds=5, rng=0)
print("CV-chosen penalty weight:", best_alpha)
gam_fit = GLMGam.from_formula("yield_ ~ 1", data=df, smoother=splines, alpha=np.atleast_1d(best_alpha)).fit()
print("effective df:", round(gam_fit.edf.sum(), 2))
fit_vs_truth = np.corrcoef(gam_fit.fittedvalues, np.sin(df["temperature"]))[0, 1]
print("corr(fitted, true curve):", round(fit_vs_truth, 3))
assert fit_vs_truth > 0.95
'''
caveats = [
    "Smoothness is NOT chosen automatically: mgcv selects it by REML/GCV; here you must give alpha or search it (select_penweight_kfold). In statsmodels 0.15 GLMGam.select_penweight() (AIC) raises AttributeError, so use the k-fold version.",
    "Smoothed columns are passed through smoother=, not written as s(x) in the formula. Basis size df=[k] plays the role of s(x, k = k).",
    "predict on new data needs both parts: fit.predict(exog=new_df, exog_smooth=new_df[['x']]); fit.predict(df) alone fails with a shape error.",
    "For a simple unpenalized spline in a linear model, bs(x, df=5) inside smf.ols is often enough (see patsy-bs).",
]
see_also = ["patsy-bs", "smoothing-spline", "spline-transformer"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.gam.generalized_additive_model.GLMGam.html"

[[entry]]
id = "het-breuschpagan"
title = "Breusch-Pagan test for heteroscedasticity of regression residuals"
kind = "evaluate"
library = "statsmodels"
import = "from statsmodels.stats.diagnostic import het_breuschpagan"
call = "lm_stat, lm_pvalue, f_stat, f_pvalue = het_breuschpagan(model.resid, model.model.exog)"
aliases = ["breusch pagan test", "heteroscedasticity test", "heteroskedasticity test", "test constant variance", "bptest", "non constant variance test", "white test"]
r = ["lmtest::bptest", "car::ncvTest"]
inputs = "Residuals of a fitted OLS; exog matrix (with constant) of variables suspected to drive the variance."
returns = "Tuple (LM statistic, LM p-value, F statistic, F p-value)."
example = '''
import numpy as np
import pandas as pd
import statsmodels.formula.api as smf
from statsmodels.stats.diagnostic import het_breuschpagan

rng = np.random.default_rng(24)
x = rng.uniform(0, 5, 200)
y = 1 + 0.8 * x + rng.normal(scale=0.2 + 0.6 * x)
df = pd.DataFrame({"x": x, "y": y})
model = smf.ols("y ~ x", data=df).fit()

lm_stat, lm_pvalue, f_stat, f_pvalue = het_breuschpagan(model.resid, model.model.exog)
print(f"BP = {lm_stat:.2f}, p = {lm_pvalue:.2e}")
assert lm_pvalue < 0.01
'''
caveats = [
    "Default robust=True is Koenker's studentized version, which matches bptest's default (studentize = TRUE). car::ncvTest is the original non-studentized test (robust=False).",
    "The exog you pass must include a constant column; model.model.exog already does.",
    "White's test (squares and cross products): het_white(model.resid, model.model.exog).",
]
see_also = ["ols-robust-se", "wls", "ols-diagnostics"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.stats.diagnostic.het_breuschpagan.html"
