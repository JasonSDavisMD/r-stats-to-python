[[entry]]
id = "silhouette-score"
title = "Silhouette score for choosing the number of clusters"
kind = "evaluate"
library = "scikit-learn"
import = "from sklearn.metrics import silhouette_samples, silhouette_score"
call = "silhouette_score(X, labels)"
aliases = ["silhouette", "choose number of clusters", "how many clusters", "optimal k", "cluster validation", "elbow method", "average silhouette width"]
r = ["cluster::silhouette", "factoextra::fviz_nbclust"]
inputs = "X (n, p) (or a distance matrix with metric='precomputed') and cluster labels (at least 2 distinct)."
returns = "silhouette_score: mean silhouette width (float in [-1, 1]); silhouette_samples: one value per point."
example = '''
from sklearn.cluster import KMeans
from sklearn.datasets import make_blobs
from sklearn.metrics import silhouette_samples, silhouette_score

X, _ = make_blobs(n_samples=300, centers=4, cluster_std=0.8, random_state=3)
scores, inertia = {}, {}
for k in range(2, 8):
    km = KMeans(n_clusters=k, n_init=10, random_state=0).fit(X)
    scores[k] = silhouette_score(X, km.labels_)
    inertia[k] = km.inertia_                       # for an elbow plot
best_k = max(scores, key=scores.get)
print({k: round(s, 3) for k, s in scores.items()}, "best k:", best_k)
per_point = silhouette_samples(X, KMeans(n_clusters=best_k, n_init=10, random_state=0).fit_predict(X))
print("min / mean per-point silhouette:", per_point.min().round(3), per_point.mean().round(3))
assert best_k == 4
'''
caveats = [
    "Needs 2 <= k <= n - 1; the silhouette is undefined for k = 1.",
    "When clusters touch, the silhouette often prefers too FEW clusters (e.g. k = 2); look at the whole curve, the elbow (inertia_) and GMM BIC, not only the argmax.",
    "silhouette_score = mean of silhouette_samples = R's summary(silhouette(...))$avg.width.",
    "Pass metric='precomputed' with a square distance matrix to reuse the dist you clustered on.",
]
see_also = ["kmeans", "hierarchical-clustering", "gaussian-mixture"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.metrics.silhouette_score.html"

