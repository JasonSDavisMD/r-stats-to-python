[[entry]]
id = "distance-matrix"
title = "Distance matrix between observations (Euclidean, Manhattan, correlation...)"
kind = "compute"
library = "SciPy"
import = "from scipy.spatial.distance import pdist, squareform"
call = "squareform(pdist(X, metric='euclidean'))"
aliases = ["distance matrix", "pairwise distances", "dissimilarity matrix", "euclidean distance", "manhattan distance", "cdist", "gower distance"]
r = ["dist", "as.matrix(dist(X))", "proxy::dist", "cluster::daisy"]
inputs = "X (n, p); metric='euclidean', 'cityblock' (manhattan), 'minkowski', 'correlation', 'cosine', ..."
returns = "pdist: condensed vector of n(n-1)/2 distances (like an R dist object); squareform: full (n, n) matrix."
example = '''
import numpy as np
from scipy.spatial.distance import cdist, pdist, squareform

rng = np.random.default_rng(28)
X = rng.normal(size=(5, 3))
d = pdist(X, metric="euclidean")          # dist(X)
D = squareform(d)                         # as.matrix(dist(X))
print(D.round(2))
manhattan = squareform(pdist(X, metric="cityblock"))   # dist(X, method = "manhattan")
print("d(0,1) manhattan:", manhattan[0, 1].round(3))
to_centers = cdist(X, X[:2])              # distances from each row to 2 reference points
print(to_centers.shape)
assert np.isclose(D[0, 1], np.linalg.norm(X[0] - X[1]))
'''
caveats = [
    "R method = 'manhattan' is metric='cityblock' in scipy; 'maximum' is 'chebyshev'.",
    "metric='correlation' is 1 - r (a distance), not r.",
    "Gower distance for mixed data (cluster::daisy) is not in scipy; encode/scale yourself or use a third-party package.",
    "sklearn.metrics.pairwise_distances returns the square matrix directly and accepts the same metric names.",
]
see_also = ["hierarchical-clustering", "classical-mds"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.spatial.distance.pdist.html"

[[entry]]
id = "classical-mds"
title = "Multidimensional scaling (classical / metric MDS) from a distance matrix"
kind = "compute"
library = "scikit-learn"
import = "from sklearn.manifold import MDS, ClassicalMDS"
call = "ClassicalMDS(n_components=2, metric='precomputed').fit_transform(D)"
aliases = ["multidimensional scaling", "mds", "principal coordinates analysis", "pcoa", "classical scaling", "nonmetric mds", "smacof"]
r = ["cmdscale", "MASS::isoMDS", "smacof::smacofSym"]
inputs = "Square symmetric distance matrix D (n, n) with metric='precomputed', or raw X (Euclidean by default)."
returns = "Array (n, n_components) of coordinates; MDS also has .stress_."
example = '''
import numpy as np
from scipy.spatial.distance import pdist, squareform
from sklearn.manifold import MDS, ClassicalMDS

rng = np.random.default_rng(29)
X = rng.normal(size=(30, 4))
D = squareform(pdist(X))
coords = ClassicalMDS(n_components=2, metric="precomputed").fit_transform(D)  # cmdscale(D, k = 2)
print("classical MDS:", coords.shape)
smacof = MDS(n_components=2, metric="precomputed", init="classical_mds", random_state=0)
coords2 = smacof.fit_transform(D)                                         # metric stress MDS
print("stress:", round(smacof.stress_, 4))
nonmetric = MDS(n_components=2, metric="precomputed", metric_mds=False, init="random",
                n_init=4, random_state=0).fit_transform(D)                 # MASS::isoMDS
print(nonmetric.shape)
assert coords.shape == (30, 2)
'''
caveats = [
    "cmdscale is ClassicalMDS (eigen-decomposition, scikit-learn >= 1.8). MDS is iterative SMACOF stress minimization, a different method.",
    "PARAMETER RENAMES in scikit-learn 1.8+: dissimilarity='precomputed' -> metric='precomputed'; the old boolean metric -> metric_mds (False = non-metric, like isoMDS).",
    "MDS: pass init= ('classical_mds' or 'random') explicitly to avoid a FutureWarning; n_init now defaults to 1.",
    "Coordinates are defined only up to rotation/reflection; signs can differ from R.",
]
see_also = ["distance-matrix", "pca", "tsne"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.manifold.ClassicalMDS.html"

[[entry]]
id = "factor-analysis"
title = "Exploratory factor analysis with varimax rotation"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.decomposition import FactorAnalysis\nfrom sklearn.preprocessing import StandardScaler"
call = "FactorAnalysis(n_components=2, rotation='varimax').fit(StandardScaler().fit_transform(X))"
aliases = ["factor analysis", "latent factors", "factor loadings", "varimax", "uniquenesses", "exploratory factor analysis", "efa"]
r = ["factanal", "psych::fa"]
inputs = "X (n, p); standardize to get loadings on the correlation scale like factanal."
returns = "Fitted estimator: .components_ (factors x variables; loadings = .components_.T), .noise_variance_ (uniquenesses), .transform(X) = factor scores, .score(X) = avg log-likelihood."
example = '''
import numpy as np
from sklearn.decomposition import FactorAnalysis
from sklearn.preprocessing import StandardScaler

rng = np.random.default_rng(30)
F = rng.normal(size=(400, 2))
L = np.array([[0.9, 0], [0.8, 0], [0.7, 0], [0, 0.9], [0, 0.8], [0, 0.7]])
X = F @ L.T + 0.5 * rng.normal(size=(400, 6))
Xs = StandardScaler().fit_transform(X)
fa = FactorAnalysis(n_components=2, rotation="varimax", random_state=0).fit(Xs)
loadings = fa.components_.T
print("loadings:\n", loadings.round(2))
print("uniquenesses:", fa.noise_variance_.round(2))
assert np.all(np.abs(loadings).max(axis=1) > 0.5)
'''
caveats = [
    "Default rotation=None; factanal defaults to varimax. Pass rotation='varimax' (or 'quartimax'). No promax/oblimin (use the factor_analyzer package).",
    "No chi-square test of 'k factors are sufficient' and no p-value, unlike factanal's printout; compare models with .score(X) (log-likelihood) instead.",
    "Fit on standardized data to get loadings on the correlation scale; loading signs and factor order can differ from R.",
]
see_also = ["pca", "standard-scaler"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.FactorAnalysis.html"
