# Topic: unsupervised -- PCA, clustering (k-means, hierarchical, GMM, DBSCAN), embeddings, distances, factor analysis.
# Key distinction: there is no y; scaling and random starts change the answer, and cluster labels are arbitrary names.
# Schema and how to add entries: docs/adding-a-topic.md

[[entry]]
id = "pca"
title = "Principal component analysis (PCA): explained variance and loadings"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.decomposition import PCA\nfrom sklearn.preprocessing import StandardScaler"
call = "PCA().fit(StandardScaler().fit_transform(X))"
aliases = ["pca", "principal component analysis", "principal components", "pca loadings", "explained variance ratio", "proportion of variance explained", "scree plot", "dimension reduction", "biplot", "pc scores"]
r = ["prcomp", "princomp", "summary(prcomp(...))"]
inputs = "X (n, p) numeric matrix; standardize first to match prcomp(scale. = TRUE)."
returns = "Fitted estimator: .explained_variance_ratio_, .components_ (rows = PCs, i.e. t(rotation)), .explained_variance_ (sdev^2), .transform(X) = scores (prcomp $x)."
example = '''
import numpy as np
from sklearn.decomposition import PCA
from sklearn.preprocessing import StandardScaler

rng = np.random.default_rng(21)
z = rng.normal(size=(200, 1))
X = np.hstack([z + 0.3 * rng.normal(size=(200, 1)), 2 * z + rng.normal(size=(200, 1)),
               rng.normal(size=(200, 1)) * 10])
Xs = StandardScaler().fit_transform(X)          # prcomp(X, scale. = TRUE)
pca = PCA().fit(Xs)
print("PVE:", pca.explained_variance_ratio_.round(3))
print("cumulative:", np.cumsum(pca.explained_variance_ratio_).round(3))
loadings = pca.components_.T                     # columns = PC1, PC2, ... like prcomp $rotation
print("loadings:\n", loadings.round(3))
scores = pca.transform(Xs)                       # prcomp $x
print("scores shape:", scores.shape)
assert np.isclose(pca.explained_variance_ratio_.sum(), 1.0)
'''
caveats = [
    "PCA() only CENTERS. prcomp(scale. = TRUE) also scales to unit variance: run StandardScaler first (or put both in a Pipeline).",
    "Explained variance ratios and loadings match prcomp(scale. = TRUE); absolute variances differ by n/(n-1) because StandardScaler uses ddof=0 while R scale() uses n - 1.",
    ".components_ is (n_components, p): rows are PCs, so loadings = pca.components_.T matches prcomp()$rotation.",
    "Signs of loadings/scores are arbitrary and can differ from R (sign indeterminacy); compare up to a sign flip per component.",
    "prcomp's sdev = np.sqrt(pca.explained_variance_). There is no biplot() built in; draw it with matplotlib.",
]
see_also = ["standard-scaler", "factor-analysis", "tsne", "kmeans"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.PCA.html"

[[entry]]
id = "kmeans"
title = "K-means clustering"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.cluster import KMeans"
call = "KMeans(n_clusters=3, n_init=20, random_state=0).fit(X)"
aliases = ["k means", "k-means clustering", "kmeans cluster", "partitioning clustering", "within cluster sum of squares", "cluster centers", "nstart"]
r = ["kmeans", "stats::kmeans"]
inputs = "X (n, p) numeric; usually standardized."
returns = "Fitted estimator: .labels_ (0-based), .cluster_centers_, .inertia_ (= R tot.withinss), .predict(new_X)."
example = '''
import numpy as np
from sklearn.cluster import KMeans
from sklearn.datasets import make_blobs

X, truth = make_blobs(n_samples=300, centers=3, cluster_std=1.0, random_state=22)
km = KMeans(n_clusters=3, n_init=20, random_state=0).fit(X)   # kmeans(X, 3, nstart = 20)
print("centers:\n", km.cluster_centers_.round(2))
print("tot.withinss:", round(km.inertia_, 2))
print("sizes:", np.bincount(km.labels_))
assert len(set(km.labels_)) == 3
'''
caveats = [
    "Set n_init explicitly (R's nstart). The default n_init='auto' runs k-means++ ONCE; R's kmeans default nstart = 1 with random starts.",
    "R's default algorithm is Hartigan-Wong; sklearn uses Lloyd (algorithm='lloyd') with k-means++ seeding. Results usually agree with enough restarts.",
    "inertia_ is R's tot.withinss. R's betweenss / totss has no attribute: compute totss = ((X - X.mean(0))**2).sum().",
    "Labels are 0-based and arbitrary; compare clusterings with a crosstab or adjusted_rand_score, not label equality.",
    "Scale the columns first (StandardScaler) if they are in different units.",
]
see_also = ["silhouette-score", "gaussian-mixture", "hierarchical-clustering", "pca"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.cluster.KMeans.html"

[[entry]]
id = "hierarchical-clustering"
title = "Hierarchical clustering with a dendrogram and cutting the tree"
kind = "fit"
library = "SciPy"
import = "from scipy.cluster.hierarchy import dendrogram, fcluster, linkage"
call = "Z = linkage(X, method='complete'); fcluster(Z, t=3, criterion='maxclust')"
aliases = ["hierarchical clustering", "dendrogram", "cut tree", "agglomerative dendrogram", "complete linkage", "average linkage", "single linkage", "ward linkage", "hclust dendrogram"]
r = ["hclust", "cutree", "plot(hclust(...))", "as.dendrogram"]
inputs = "Raw observations X (n, p), or a condensed distance vector from pdist (R's dist object)."
returns = "linkage: Z matrix (n-1, 4) = merges and heights (hclust $merge/$height); fcluster: 1-based cluster labels (cutree); dendrogram draws on the current axes."
example = '''
import matplotlib.pyplot as plt
import numpy as np
from scipy.cluster.hierarchy import dendrogram, fcluster, linkage
from scipy.spatial.distance import pdist
from sklearn.datasets import make_blobs

X, _ = make_blobs(n_samples=40, centers=3, random_state=23)
Z = linkage(pdist(X), method="complete")          # hclust(dist(X), method = "complete")
labels = fcluster(Z, t=3, criterion="maxclust")   # cutree(hc, k = 3)
print("sizes:", np.bincount(labels)[1:])
by_height = fcluster(Z, t=5.0, criterion="distance")  # cutree(hc, h = 5)
print("clusters at h=5:", by_height.max())
fig, ax = plt.subplots(figsize=(8, 4))
dendrogram(Z, ax=ax, color_threshold=Z[-3, 2] + 1e-9)
ax.set_ylabel("height")
plt.close(fig)
assert labels.max() == 3
'''
caveats = [
    "METHOD NAMES: scipy method='ward' on raw X (or Euclidean pdist) equals R's hclust(method = 'ward.D2'); R's 'ward.D' (the old default 'ward') squares nothing and differs.",
    "scipy's default method is 'single'; R's hclust default is 'complete'. Always pass method=.",
    "'centroid', 'median' and 'ward' require Euclidean distances. Passing a 2-D array is treated as observations, not as a distance matrix: convert a square matrix with squareform() first.",
    "fcluster labels start at 1 like cutree, but numbering can differ from R's. The dendrogram leaf order can also differ.",
]
see_also = ["agglomerative-clustering", "distance-matrix", "kmeans", "silhouette-score"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.cluster.hierarchy.linkage.html"

