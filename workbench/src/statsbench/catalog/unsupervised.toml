id = "agglomerative-clustering"
title = "Agglomerative (hierarchical) clustering as a scikit-learn estimator"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.cluster import AgglomerativeClustering"
call = "AgglomerativeClustering(n_clusters=3, linkage='average').fit(X)"
aliases = ["agglomerative clustering sklearn", "hierarchical clustering sklearn", "bottom up clustering", "connectivity constrained clustering", "distance threshold clustering"]
r = ["cutree(hclust(dist(X)), k = 3)"]
inputs = "X (n, p), or a square distance matrix with metric='precomputed' (not with ward)."
returns = "Fitted estimator: .labels_ (0-based), .n_clusters_, .children_ (merge tree); .distances_ if compute_distances=True."
example = '''
import numpy as np
from sklearn.cluster import AgglomerativeClustering
from sklearn.datasets import make_blobs
from sklearn.metrics import adjusted_rand_score

X, truth = make_blobs(n_samples=150, centers=3, random_state=24)
agg = AgglomerativeClustering(n_clusters=3, linkage="average").fit(X)
print("sizes:", np.bincount(agg.labels_))
cut = AgglomerativeClustering(n_clusters=None, distance_threshold=10.0, linkage="ward").fit(X)
print("clusters below height 10 (ward):", cut.n_clusters_)
ari = adjusted_rand_score(truth, agg.labels_)
print("ARI vs truth:", round(ari, 3))
assert ari > 0.9
'''
caveats = [
    "Default linkage is 'ward' (R hclust default is 'complete'); sklearn's ward = R's 'ward.D2'.",
    "No dendrogram plot or predict() for new points. For a dendrogram use scipy linkage + dendrogram.",
    "Use metric= (the old affinity= parameter was removed). metric='precomputed' needs linkage other than 'ward'.",
]
see_also = ["hierarchical-clustering", "kmeans", "dbscan"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.cluster.AgglomerativeClustering.html"

[[entry]]
id = "gaussian-mixture"
title = "Gaussian mixture model clustering, choosing k by BIC"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.mixture import GaussianMixture"
call = "GaussianMixture(n_components=3, covariance_type='full', n_init=5, random_state=0).fit(X)"
aliases = ["gaussian mixture", "mixture model", "gmm", "model based clustering", "em algorithm clustering", "soft clustering", "bic number of clusters", "mixture of normals"]
r = ["mclust::Mclust", "Mclust", "mixtools::normalmixEM"]
inputs = "X (n, p) numeric."
returns = "Fitted estimator: .weights_, .means_, .covariances_, .predict (hard labels), .predict_proba (responsibilities), .bic(X), .aic(X)."
example = '''
import numpy as np
from sklearn.datasets import make_blobs
from sklearn.mixture import GaussianMixture

X, _ = make_blobs(n_samples=300, centers=3, cluster_std=[1.0, 1.5, 0.5], random_state=25)
bic = {}
for k in range(1, 6):
    gm = GaussianMixture(n_components=k, covariance_type="full", n_init=3, random_state=0).fit(X)
    bic[k] = gm.bic(X)
best_k = min(bic, key=bic.get)                      # LOWER BIC is better in sklearn
print({k: round(v, 1) for k, v in bic.items()}, "best k:", best_k)
gm = GaussianMixture(n_components=best_k, n_init=3, random_state=0).fit(X)
print("weights:", gm.weights_.round(3))
print("responsibilities, first row:", gm.predict_proba(X[:1]).round(3))
assert best_k == 3
'''
caveats = [
    "BIC SIGN: sklearn's .bic() is -2 logL + k log n (smaller is better); mclust reports 2 logL - k log n (larger is better).",
    "mclust searches many covariance models (VVV, EII, ...) automatically; sklearn has four covariance_type values ('full', 'tied', 'diag', 'spherical') and you loop over them and k yourself.",
    "Default n_init=1 and k-means initialization; set n_init > 1 and random_state to avoid poor local optima.",
]
see_also = ["kmeans", "silhouette-score", "dbscan"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.mixture.GaussianMixture.html"

