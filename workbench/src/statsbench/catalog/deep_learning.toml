[[entry]]
id = "torch-no-grad"
title = "Inference and prediction without gradients: torch.no_grad and model.eval"
kind = "evaluate"
library = "PyTorch"
import = "import torch"
call = "model.eval() ; with torch.no_grad(): pred = model(X_new)"
aliases = ["no_grad", "inference mode", "predict pytorch", "pytorch prediction", "predict with trained network", "disable gradient", "torch predict new data"]
r = ["predict", "torch::with_no_grad"]
inputs = "A trained module and new inputs of the right dtype, shape and device."
returns = "Output tensor with requires_grad=False (cheaper; convertible with .numpy())."
example = '''
import torch
from torch import nn

torch.manual_seed(5)
model = nn.Sequential(nn.Linear(2, 8), nn.ReLU(), nn.Dropout(0.5), nn.Linear(8, 1))
X_new = torch.randn(4, 2)

out_grad = model(X_new)
print("with graph:", out_grad.requires_grad)          # True: a computation graph was built

model.eval()                                          # Dropout off -> deterministic output
with torch.no_grad():                                 # no graph -> less memory, faster
    pred1 = model(X_new)
    pred2 = model(X_new)
print("no_grad:", pred1.requires_grad, pred1.ravel().numpy())
assert not pred1.requires_grad and torch.equal(pred1, pred2)
'''
caveats = [
    "no_grad and eval() do different things: no_grad stops gradient tracking; eval() changes Dropout/BatchNorm behaviour. For prediction you usually want both.",
    "torch.inference_mode() is a stricter, slightly faster alternative to no_grad.",
    "Outputs are logits for models trained with BCEWithLogitsLoss/CrossEntropyLoss: apply sigmoid/softmax for probabilities.",
]
see_also = ["torch-mlp-classifier", "torch-save-state-dict", "torch-logistic-regression"]
docs = "https://pytorch.org/docs/stable/generated/torch.no_grad.html"
