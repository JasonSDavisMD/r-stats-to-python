title = "Save and load model weights (state_dict) with torch.save and torch.load"
kind = "compute"
library = "PyTorch"
import = "import io\nimport torch"
call = "torch.save(model.state_dict(), buffer_or_path) ; model.load_state_dict(torch.load(buffer_or_path, weights_only=True))"
aliases = ["save model", "load model", "state_dict", "checkpoint", "serialize weights", "torch.save", "persist trained network"]
r = ["torch::torch_save", "torch::torch_load", "saveRDS", "keras::save_model_hdf5"]
inputs = "A model's state_dict (ordered dict of parameter tensors); a file path or file-like object."
returns = "load_state_dict returns a report of missing/unexpected keys; the model now has the saved weights."
example = '''
import io
import torch
from torch import nn

torch.manual_seed(4)
model = nn.Sequential(nn.Linear(3, 4), nn.ReLU(), nn.Linear(4, 1))
print(list(model.state_dict().keys()))          # parameter names -> tensors

buffer = io.BytesIO()                           # in memory here; normally a path like "model.pt"
torch.save(model.state_dict(), buffer)
buffer.seek(0)

clone = nn.Sequential(nn.Linear(3, 4), nn.ReLU(), nn.Linear(4, 1))   # same architecture
clone.load_state_dict(torch.load(buffer, weights_only=True))
clone.eval()
x = torch.randn(5, 3)
with torch.no_grad():
    same = torch.equal(model(x), clone(x))
print("identical predictions:", same)
assert same
'''
caveats = [
    "A state_dict holds only weights: rebuild the SAME architecture in code before load_state_dict.",
    "torch.load(..., weights_only=True) (the default in PyTorch >= 2.6) refuses arbitrary pickled objects; only load untrusted files that way.",
    "Load GPU-saved weights on a CPU machine with torch.load(path, map_location='cpu').",
    "Call model.eval() after loading if you will predict.",
]
