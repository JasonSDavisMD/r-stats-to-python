[[entry]]
id = "torch-autograd"
title = "Automatic differentiation: gradient of a function with autograd"
kind = "compute"
library = "PyTorch"
import = "import torch"
call = "x = torch.tensor(2.0, requires_grad=True) ; y = f(x) ; y.backward() ; x.grad"
aliases = ["autograd", "automatic differentiation", "gradient", "derivative", "backpropagation", "backward", "requires_grad", "compute gradient numerically", "pytorch gradient"]
r = ["torch::autograd_grad", "numDeriv::grad", "D"]
inputs = "Leaf tensors with requires_grad=True; a scalar output built from them."
returns = "x.grad holds d(output)/dx after output.backward()."
example = '''
import torch

x = torch.tensor([0.5, 2.0], dtype=torch.float64, requires_grad=True)
y = (x ** 3 + torch.sin(x)).sum()          # f(x) = sum(x^3 + sin x); scalar output
y.backward()                               # fills x.grad
analytic = 3 * x.detach() ** 2 + torch.cos(x.detach())
print(x.grad, analytic)
assert torch.allclose(x.grad, analytic)

# Gradient of the log-likelihood of a Normal mean (score function)
data = torch.tensor([1.0, 2.0, 4.0], dtype=torch.float64)
mu = torch.tensor(1.0, dtype=torch.float64, requires_grad=True)
loglik = torch.distributions.Normal(mu, 1.0).log_prob(data).sum()
(grad_mu,) = torch.autograd.grad(loglik, mu)
print(grad_mu.item(), (data - 1.0).sum().item())   # score = sum(x - mu)
'''
caveats = [
    "backward() needs a SCALAR output; for a vector output sum it or pass a gradient argument.",
    "Gradients ACCUMULATE in .grad across backward() calls: zero them (optimizer.zero_grad()) in a training loop.",
    "This is exact derivative evaluation at a point, not symbolic: for a formula use sympy-diff.",
]
see_also = ["torch-tensor", "torch-linear-regression", "sympy-diff", "minimize"]
docs = "https://pytorch.org/docs/stable/autograd.html"
requires = ["torch"]
extra = "deep"

[[entry]]
id = "torch-linear-regression"
title = "Linear regression in PyTorch: nn.Linear, MSELoss and an optimizer training loop"
kind = "fit"
library = "PyTorch"
import = "import torch\nfrom torch import nn"
call = "model = nn.Linear(p, 1) ; opt = torch.optim.SGD(model.parameters(), lr=0.1) ; loss = nn.MSELoss()(model(X), y) ; opt.zero_grad() ; loss.backward() ; opt.step()"
aliases = ["pytorch linear regression", "torch linear regression", "nn.Linear", "training loop", "gradient descent", "mse loss", "optimizer step", "sgd", "adam", "pytorch regression"]
r = ["torch::nn_linear", "torch::optim_sgd", "keras::layer_dense"]
inputs = "float32 X of shape (n, p) and y of shape (n, 1); learning rate; number of epochs."
returns = "Fitted module: model.weight (1, p) and model.bias (1,) approximate the least-squares coefficients."
example = '''
import numpy as np
import torch
from torch import nn

torch.manual_seed(0)
torch.set_num_threads(1)
rng = np.random.default_rng(0)
X_np = rng.normal(size=(200, 2))
y_np = 1.0 + X_np @ np.array([2.0, -3.0]) + rng.normal(scale=0.1, size=200)

X = torch.tensor(X_np, dtype=torch.float32)
y = torch.tensor(y_np, dtype=torch.float32).reshape(-1, 1)   # (n, 1) to match the output
model = nn.Linear(2, 1)                  # y = X @ W.T + b
loss_fn = nn.MSELoss()
opt = torch.optim.SGD(model.parameters(), lr=0.1)
for epoch in range(300):
    opt.zero_grad()
    loss = loss_fn(model(X), y)
    loss.backward()
    opt.step()

# Compare with closed-form least squares
design = np.column_stack([np.ones(200), X_np])
beta_ls, *_ = np.linalg.lstsq(design, y_np, rcond=None)
beta_torch = np.r_[model.bias.item(), model.weight.detach().numpy().ravel()]
print("torch:", beta_torch.round(4), " lstsq:", beta_ls.round(4), " loss:", loss.item())
assert np.allclose(beta_torch, beta_ls, atol=1e-3)
'''
caveats = [
    "No standard errors, p-values or formula interface: for inference use smf-ols (R lm). Use this pattern to learn the training loop.",
    "y must be shape (n, 1) like the model output; a (n,) target silently broadcasts to (n, n) in MSELoss (with a warning) and gives wrong fits.",
    "Result depends on learning rate, epochs and random initialization; unscaled features make SGD slow or divergent.",
    "Forgetting opt.zero_grad() accumulates gradients across iterations.",
]
see_also = ["smf-ols", "np-lstsq", "torch-autograd", "torch-logistic-regression", "torch-dataloader"]
docs = "https://pytorch.org/docs/stable/generated/torch.nn.Linear.html"
requires = ["torch"]
extra = "deep"

[[entry]]
id = "torch-logistic-regression"
title = "Logistic regression in PyTorch with BCEWithLogitsLoss (outputs are logits)"
kind = "fit"
library = "PyTorch"
import = "import torch\nfrom torch import nn"
call = "model = nn.Linear(p, 1) ; loss = nn.BCEWithLogitsLoss()(model(X), y) ; prob = torch.sigmoid(model(X_new))"
aliases = ["pytorch logistic regression", "torch logistic regression", "BCEWithLogitsLoss", "binary cross entropy", "model outputs logits", "sigmoid", "log-odds output", "pytorch binary classification"]
r = ["torch::nn_bce_with_logits_loss", "keras::loss_binary_crossentropy"]
inputs = "float32 X (n, p); float32 0/1 targets y of shape (n, 1)."
returns = "Module whose output is the LOGIT (log-odds); torch.sigmoid(logit) = expit(logit) = probability."
example = '''
import numpy as np
import torch
from torch import nn
from scipy.special import expit

torch.manual_seed(1)
torch.set_num_threads(1)
rng = np.random.default_rng(1)
X_np = rng.normal(size=(500, 1))
y_np = rng.binomial(1, expit(-0.5 + 2.0 * X_np[:, 0]))

X = torch.tensor(X_np, dtype=torch.float32)
y = torch.tensor(y_np, dtype=torch.float32).reshape(-1, 1)   # float targets, shape (n, 1)
model = nn.Linear(1, 1)                  # output = b0 + b1 * x = log-odds (logit)
loss_fn = nn.BCEWithLogitsLoss()         # sigmoid + binary cross-entropy, numerically stable
opt = torch.optim.Adam(model.parameters(), lr=0.05)
for epoch in range(400):
    opt.zero_grad()
    loss = loss_fn(model(X), y)
    loss.backward()
    opt.step()

b0, b1 = model.bias.item(), model.weight.item()
with torch.no_grad():
    prob = torch.sigmoid(model(torch.tensor([[0.0], [1.0]])))
print("intercept, slope:", round(b0, 3), round(b1, 3))
print("P(y=1 | x=0, 1):", prob.ravel().numpy(), expit(np.array([b0, b0 + b1])))
assert abs(b1 - 2.0) < 0.5
'''
caveats = [
    "Do NOT put nn.Sigmoid() at the end of the model when using BCEWithLogitsLoss: the loss applies the sigmoid itself. Apply torch.sigmoid only for predicted probabilities.",
    "Targets must be float (0.0/1.0), not int, and the same shape as the output.",
    "Unpenalized maximum likelihood here, so estimates approach glm(family = binomial); an optimizer's weight_decay adds an L2 penalty like sklearn's default.",
    "For coefficient tables, standard errors and p-values use glm-binomial instead.",
]
see_also = ["expit", "glm-binomial", "sk-logistic", "torch-linear-regression", "torch-mlp-classifier"]
docs = "https://pytorch.org/docs/stable/generated/torch.nn.BCEWithLogitsLoss.html"
requires = ["torch"]
extra = "deep"

[[entry]]
id = "torch-mlp-classifier"
title = "Small neural network (MLP) classifier with nn.Sequential, train and eval modes"
kind = "fit"
library = "PyTorch"
import = "import torch\nfrom torch import nn"
call = "nn.Sequential(nn.Linear(p, 16), nn.ReLU(), nn.Linear(16, k)) ; nn.CrossEntropyLoss() ; model.train() / model.eval()"
aliases = ["pytorch neural network", "pytorch mlp", "torch neural network classifier", "deep learning pytorch", "nn.Sequential", "hidden layer relu", "dropout", "cross entropy loss", "train eval mode", "pytorch classifier"]
r = ["keras::keras_model_sequential", "torch::nn_sequential", "keras::layer_dropout"]
inputs = "float32 features X (n, p); integer (int64) class labels 0..k-1."
returns = "Module whose output is k logits per row; argmax gives the class, softmax gives probabilities."
example = '''
import numpy as np
import torch
from torch import nn

torch.manual_seed(2)
torch.set_num_threads(1)
rng = np.random.default_rng(2)
X_np = rng.normal(size=(400, 2))
y_np = (X_np[:, 0] ** 2 + X_np[:, 1] ** 2 > 1.4).astype(int)    # circle: not linearly separable

X = torch.tensor(X_np, dtype=torch.float32)
y = torch.tensor(y_np, dtype=torch.long)       # class indices, int64
model = nn.Sequential(
    nn.Linear(2, 16), nn.ReLU(),
    nn.Dropout(p=0.1),                          # behaves differently in train vs eval
    nn.Linear(16, 2),                           # 2 logits (one per class)
)
loss_fn = nn.CrossEntropyLoss()                 # softmax + negative log-likelihood
opt = torch.optim.Adam(model.parameters(), lr=0.02)

model.train()
for epoch in range(300):
    opt.zero_grad()
    loss = loss_fn(model(X), y)
    loss.backward()
    opt.step()

model.eval()                                    # turn off dropout for prediction
with torch.no_grad():
    logits = model(X)
    prob = torch.softmax(logits, dim=1)
    pred = logits.argmax(dim=1)
accuracy = (pred == y).float().mean().item()
print("training accuracy:", round(accuracy, 3), " first probs:", prob[:2].numpy().round(3))
assert accuracy > 0.9
'''
caveats = [
    "CrossEntropyLoss wants raw logits and int64 class indices (not one-hot, no softmax layer).",
    "Call model.eval() before predicting: Dropout and BatchNorm behave differently in training mode. model.train() switches back.",
    "Training accuracy is optimistic; hold out data (train-test-split) or cross-validate.",
    "Results depend on the seed and initialization; small data sets rarely need a neural network (compare with sk-logistic or random-forest).",
]
see_also = ["torch-logistic-regression", "torch-dataloader", "torch-no-grad", "sk-logistic", "random-forest", "train-test-split"]
docs = "https://pytorch.org/docs/stable/generated/torch.nn.Sequential.html"
requires = ["torch"]
extra = "deep"

[[entry]]
id = "torch-dataloader"
title = "Mini-batches with TensorDataset and DataLoader"
kind = "compute"
library = "PyTorch"
import = "import torch\nfrom torch.utils.data import TensorDataset, DataLoader"
call = "loader = DataLoader(TensorDataset(X, y), batch_size=32, shuffle=True, generator=torch.Generator().manual_seed(0))"
aliases = ["dataloader", "mini batch", "minibatch", "batch size", "stochastic gradient descent batches", "tensordataset", "shuffle batches", "epoch loop"]
r = ["torch::dataloader", "torch::tensor_dataset", "keras::fit(batch_size = )"]
inputs = "Tensors with the same first dimension; batch_size; shuffle."
returns = "Iterable yielding (X_batch, y_batch) tuples; one full pass = one epoch."
example = '''
import numpy as np
import torch
from torch import nn
from torch.utils.data import TensorDataset, DataLoader

torch.manual_seed(3)
torch.set_num_threads(1)
rng = np.random.default_rng(3)
X = torch.tensor(rng.normal(size=(250, 3)), dtype=torch.float32)
y = (X @ torch.tensor([[1.0], [-2.0], [0.5]]) + 0.1 * torch.randn(250, 1))

loader = DataLoader(TensorDataset(X, y), batch_size=32, shuffle=True,
                    generator=torch.Generator().manual_seed(0))   # reproducible shuffling
xb, yb = next(iter(loader))
print("batches per epoch:", len(loader), " batch shapes:", tuple(xb.shape), tuple(yb.shape))

model = nn.Linear(3, 1)
opt = torch.optim.SGD(model.parameters(), lr=0.05)
loss_fn = nn.MSELoss()
for epoch in range(20):
    for xb, yb in loader:              # one optimizer step per mini-batch
        opt.zero_grad()
        loss_fn(model(xb), yb).backward()
        opt.step()
print("weights:", model.weight.detach().numpy().round(2))
assert len(loader) == 8                # ceil(250 / 32); last batch has 26 rows
assert torch.allclose(model.weight.detach(), torch.tensor([[1.0, -2.0, 0.5]]), atol=0.05)
'''
caveats = [
    "The last batch is smaller unless drop_last=True.",
    "shuffle=True uses the global torch RNG unless you pass generator=; set it for reproducible batches.",
    "num_workers > 0 starts subprocesses (slow to start, tricky on Windows/notebooks); keep 0 for small data.",
]
see_also = ["torch-linear-regression", "torch-mlp-classifier", "torch-device-seed"]
docs = "https://pytorch.org/docs/stable/data.html"
requires = ["torch"]
extra = "deep"

[[entry]]
id = "torch-device-seed"
title = "Reproducibility and device selection in PyTorch (manual_seed; cuda, mps or cpu)"
kind = "compute"
library = "PyTorch"
import = "import torch"
call = "torch.manual_seed(0) ; device = 'cuda' if torch.cuda.is_available() else 'mps' if torch.backends.mps.is_available() else 'cpu' ; model.to(device)"
aliases = ["set seed pytorch", "random seed", "reproducible", "reproducibility", "gpu", "cuda", "mps apple silicon", "device", "move model to gpu", "deterministic"]
r = ["torch::torch_manual_seed", "set.seed", "torch::cuda_is_available"]
inputs = "An integer seed; a device string."
returns = "Nothing (seeds the global generator); a torch.device to pass to .to(device)."
example = '''
import torch
from torch import nn

def pick_device():
    if torch.cuda.is_available():
        return torch.device("cuda")
    if torch.backends.mps.is_available():          # Apple silicon GPU
        return torch.device("mps")
    return torch.device("cpu")

device = pick_device()
print("device:", device)

torch.manual_seed(42)                     # seeds CPU and all GPUs
first = torch.randn(3)
torch.manual_seed(42)
second = torch.randn(3)
print(first, second)
assert torch.equal(first, second)         # same seed -> same numbers

torch.manual_seed(0)
model = nn.Linear(2, 1).to(device)        # the model AND every input must be on the same device
x = torch.ones(4, 2, device=device)
print(model(x).detach().cpu().numpy().ravel())   # .cpu() before .numpy()
'''
caveats = [
    "torch.manual_seed does not seed NumPy or Python's random: seed those separately (np.random.default_rng(seed)).",
    "Same seed can still give different numbers on a different device, PyTorch version or thread count; torch.use_deterministic_algorithms(True) makes GPU ops deterministic where possible.",
    "A model and its inputs on different devices raise 'Expected all tensors to be on the same device'.",
]
see_also = ["torch-tensor", "torch-dataloader", "rng-draws"]
docs = "https://pytorch.org/docs/stable/notes/randomness.html"
requires = ["torch"]
extra = "deep"

