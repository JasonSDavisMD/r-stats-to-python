title = "Create a PyTorch tensor and convert to and from NumPy"
kind = "compute"
library = "PyTorch"
import = "import numpy as np\nimport torch"
call = "torch.tensor(x, dtype=torch.float32) ; torch.from_numpy(a) ; t.detach().numpy()"
aliases = ["pytorch", "torch", "tensor", "pytorch tensor", "numpy to tensor", "tensor to numpy", "float32 vs float64", "torch dtype", "convert array to tensor"]
r = ["torch::torch_tensor", "torch::as_array", "as.array"]
inputs = "A Python list or NumPy array (and optionally a dtype)."
returns = "torch.Tensor with .shape, .dtype, .device; .numpy() gives back a NumPy array (CPU tensors only)."
example = '''
import numpy as np
import torch

a = np.array([[1.0, 2.0], [3.0, 4.0]])      # NumPy default: float64
t64 = torch.from_numpy(a)                    # shares memory, keeps float64
t32 = torch.tensor(a, dtype=torch.float32)   # copies; float32 is what nn layers expect
print(t64.dtype, t32.dtype, t32.shape)

t64[0, 0] = 100.0                            # from_numpy shares memory ...
print(a[0, 0])                               # ... so the NumPy array changed too

back = (t32 @ t32.T).detach().numpy()        # matrix product, then back to NumPy
print(back)
print(torch.tensor([1.0, 2.0]).dtype)        # a Python float list becomes float32
assert np.allclose(back, np.array([[5.0, 11.0], [11.0, 25.0]]))
'''
caveats = [
    "torch.tensor([1.0]) is float32, while NumPy and R use float64 (double). Mixing float64 data with an nn.Linear (float32 weights) raises a dtype error: convert with .float() or dtype=torch.float32.",
    "torch.from_numpy and .numpy() SHARE memory with the array; torch.tensor(...) copies.",
    "Call .detach() before .numpy() on a tensor that requires grad, and .cpu() first if it lives on a GPU.",
    "Indexing is 0-based and t.shape is like dim() in R; there is no recycling, only NumPy-style broadcasting.",
]
see_also = ["torch-autograd", "torch-device-seed", "np-shape", "np-broadcasting"]
