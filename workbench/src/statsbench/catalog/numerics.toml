# Topic: numerics -- curve fitting, densities, quantiles, integrals, ODEs, decompositions (SciPy / NumPy).
# Key distinction: R bundles these in base/stats with R defaults; SciPy/NumPy defaults often DIFFER, so name them explicitly.
# Schema and how to add entries: docs/adding-a-topic.md

[[entry]]
id = "curve-fit"
title = "Nonlinear least squares curve fitting with parameter standard errors"
kind = "fit"
library = "SciPy"
import = "from scipy.optimize import curve_fit"
call = "params, pcov = curve_fit(f, x, y, p0=start)"
aliases = ["nls", "nonlinear regression", "nonlinear least squares", "fit a curve", "exponential decay fit", "dose response curve", "fit custom model to data"]
r = ["nls", "minpack.lm::nlsLM"]
inputs = "f(x, *params) -> predicted y (vectorized); x, y arrays; p0 = starting values (one per parameter); optional sigma=, bounds=."
returns = "(params, pcov): best-fit array and its covariance matrix; standard errors = np.sqrt(np.diag(pcov))."
example = '''
import numpy as np
from scipy.optimize import curve_fit

rng = np.random.default_rng(3)
x = np.linspace(0, 10, 50)
y = 5.0 * np.exp(-0.4 * x) + 1.0 + rng.normal(0, 0.1, x.size)

def model(x, a, k, c):              # parameters come AFTER x, as separate arguments
    return a * np.exp(-k * x) + c

params, pcov = curve_fit(model, x, y, p0=[1.0, 0.1, 0.0])
se = np.sqrt(np.diag(pcov))         # same SEs as summary(nls(...))
for name, est, s in zip(["a", "k", "c"], params, se):
    print(f"{name} = {est:.3f}  (SE {s:.3f})")
assert np.allclose(params, [5.0, 0.4, 1.0], atol=0.2)
'''
caveats = [
    "If p0 is omitted every starting value is 1.0 (R nls REQUIRES start=). Bad starts can converge to nonsense; always pass p0.",
    "Default absolute_sigma=False scales pcov by the residual variance, matching R nls SEs. Set absolute_sigma=True only when sigma= holds KNOWN measurement SDs.",
    "No summary table, t-tests or confint: compute t = params / se and use scipy.stats.t with n - p df yourself, or fit with statsmodels if the model is linear in parameters.",
    "Use bounds=(lower, upper) to keep rates positive; the method then switches from 'lm' to 'trf' (like nlsLM with lower/upper).",
]
see_also = ["minimize", "dist-fit-mle", "smf-ols"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.optimize.curve_fit.html"

[[entry]]
id = "dist-fit-mle"
title = "Fit a probability distribution to data by maximum likelihood"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.gamma.fit(x, floc=0)"
aliases = ["fitdistr", "fit distribution", "maximum likelihood distribution fit", "estimate gamma shape and scale", "fit weibull to data", "fit lognormal", "mle of distribution parameters", "fitdistrplus"]
r = ["MASS::fitdistr", "fitdistrplus::fitdist"]
inputs = "1-D data x; optional fixed parameters floc=, fscale=, f0= (first shape); optional starting guesses as positional args."
returns = "Tuple (shape(s)..., loc, scale). No standard errors."
example = '''
import numpy as np
from scipy import stats

rng = np.random.default_rng(11)
x = rng.gamma(shape=2.0, scale=3.0, size=500)

shape, loc, scale = stats.gamma.fit(x, floc=0)       # 2-parameter gamma, like fitdistr(x, "gamma")
print(f"shape={shape:.3f}  scale={scale:.3f}  rate={1/scale:.3f}")
loglik = stats.gamma.logpdf(x, shape, loc, scale).sum()
print("log-likelihood:", round(loglik, 2), " AIC:", round(-2 * loglik + 2 * 2, 2))
assert loc == 0 and abs(shape - 2.0) < 0.4
'''
caveats = [
    "SciPy distributions have an extra LOCATION parameter. Without floc=0 a gamma/Weibull/lognormal fit becomes a 3-parameter (shifted) fit, unlike MASS::fitdistr. Pass floc=0.",
    "SciPy uses scale; R gamma uses rate by default (rate = 1/scale). Lognormal: s = sdlog, scale = exp(meanlog).",
    "No standard errors are returned (fitdistr gives them). Get them from the inverse Hessian of the negative log-likelihood (e.g. via minimize) or bootstrap.",
    "scipy.stats.fit(dist, x, bounds=...) is the newer interface: it needs bounds, returns a FitResult (.params, .nllf(), .plot()) and uses a global optimizer, so it is slower.",
    "stats.norm.fit returns the MLE sd (divisor n), as fitdistr does, not sd(x) (divisor n - 1).",
]
see_also = ["norm-dist", "minimize", "gaussian-kde", "ecdf"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.rv_continuous.fit.html"

[[entry]]
id = "gaussian-kde"
title = "Kernel density estimate of a sample (smooth histogram)"
kind = "fit"
library = "SciPy"
import = "from scipy.stats import gaussian_kde"
call = "gaussian_kde(x, bw_method='scott')(grid)"
aliases = ["density", "kde", "kernel density", "density estimate", "smooth density curve", "density plot", "bandwidth"]
r = ["density", "bw.nrd0", "MASS::kde2d"]
inputs = "Data x (1-D, or shape (d, n) for d-dimensional); bw_method = 'scott', 'silverman', a scalar FACTOR, or a callable."
returns = "A gaussian_kde object; call it on grid points to get density values. .factor, .covariance give the bandwidth."
example = '''
import numpy as np
from scipy.stats import gaussian_kde

rng = np.random.default_rng(5)
x = np.concatenate([rng.normal(0, 1, 300), rng.normal(4, 0.7, 200)])

# Reproduce R's density(x) default bandwidth bw.nrd0
sd = np.std(x, ddof=1)
iqr = np.subtract(*np.quantile(x, [0.75, 0.25]))
h_r = 0.9 * min(sd, iqr / 1.34) * x.size ** (-0.2)
kde = gaussian_kde(x, bw_method=h_r / sd)          # bw_method is a FACTOR times sd, not the bandwidth

grid = np.linspace(-4, 7, 512)
dens = kde(grid)
print("bandwidth:", round(h_r, 4), " kernel sd:", round(float(np.sqrt(kde.covariance[0, 0])), 4))
print("area under curve:", round(np.trapezoid(dens, grid), 3))
assert np.isclose(np.sqrt(kde.covariance[0, 0]), h_r)
'''
caveats = [
    "Default bandwidth differs from R: SciPy uses Scott's rule sd * n^(-1/5); R density() uses bw.nrd0 = 0.9 * min(sd, IQR/1.34) * n^(-1/5). SciPy's curve is usually smoother.",
    "A scalar bw_method is a multiplier of the data sd, NOT the bandwidth itself (R's bw= IS the bandwidth). Pass bandwidth / sd.",
    "Only a Gaussian kernel. For other kernels or a density on a bounded range, see statsmodels.nonparametric.KDEUnivariate or sklearn KernelDensity.",
    "You choose the evaluation grid; R density() picks 512 points automatically.",
]
see_also = ["ecdf", "dist-fit-mle", "np-quantile"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.gaussian_kde.html"

[[entry]]
id = "ecdf"
title = "Empirical cumulative distribution function (ECDF) of a sample"
kind = "compute"
library = "SciPy"
import = "from scipy.stats import ecdf"
call = "ecdf(x).cdf.evaluate(t)"
aliases = ["empirical cdf", "empirical distribution function", "cumulative proportion", "proportion below a value", "ecdf plot"]
r = ["ecdf", "plot.ecdf"]
inputs = "1-D sample x (or scipy.stats.CensoredData for right-censored data)."
returns = "ECDFResult: .cdf and .sf, each with .evaluate(t), .quantiles, .probabilities, .confidence_interval(), .plot(ax)."
example = '''
import numpy as np
import matplotlib.pyplot as plt
from scipy.stats import ecdf

rng = np.random.default_rng(2)
x = rng.normal(10, 2, 200)

res = ecdf(x)
p = res.cdf.evaluate([8.0, 10.0, 12.0])      # like Fn <- ecdf(x); Fn(c(8, 10, 12))
print(p)
assert np.allclose(p, [np.mean(x <= t) for t in (8.0, 10.0, 12.0)])

fig, ax = plt.subplots()
res.cdf.plot(ax)                            # step plot, like plot(ecdf(x))
plt.close(fig)
'''
caveats = [
    "R's ecdf(x) returns a FUNCTION; SciPy returns an object: call .cdf.evaluate(t), not res(t).",
    "Given CensoredData.right_censored(time, censored) it returns the Kaplan-Meier estimate (.sf); note censored=True means NOT observed, the opposite of R's status=1.",
]
see_also = ["np-quantile", "gaussian-kde", "kaplan-meier"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.ecdf.html"

