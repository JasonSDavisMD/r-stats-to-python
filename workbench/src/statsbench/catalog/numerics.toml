[[entry]]
id = "numerical-derivative"
title = "Numerical derivative, gradient, Jacobian or Hessian of a function"
kind = "compute"
library = "SciPy"
import = "from scipy.differentiate import derivative, jacobian, hessian"
call = "derivative(f, x).df   # jacobian(f, x).df, hessian(f, x).ddf"
aliases = ["numerical derivative", "gradient", "finite differences", "jacobian", "numerical hessian", "derivative at a point", "delta method gradient"]
r = ["numDeriv::grad", "numDeriv::jacobian", "numDeriv::hessian", "optimHess"]
inputs = "A VECTORIZED function f and the point(s) x. For jacobian/hessian, f takes an array whose FIRST axis indexes the variables."
returns = "Result object: .df (derivative or Jacobian) or .ddf (Hessian), plus .error estimate and .success."
example = '''
import numpy as np
from scipy.differentiate import derivative, hessian

res = derivative(np.exp, np.array([0.0, 1.0]))     # elementwise derivative at 2 points
print(res.df, res.success)
assert np.allclose(res.df, np.exp([0.0, 1.0]))

def negloglik(theta):                              # theta[0] = mu, theta[1] = log sigma
    data = np.array([4.1, 5.3, 6.0, 4.8, 5.5])
    mu, log_sigma = theta[0], theta[1]
    data = data.reshape((-1,) + (1,) * np.ndim(mu))  # broadcast over SciPy's extra axes
    z = (data - mu) / np.exp(log_sigma)
    return np.sum(0.5 * z ** 2 + log_sigma, axis=0)

H = hessian(negloglik, np.array([5.14, np.log(0.65)])).ddf   # Hessian is .ddf, not .df
print("observed information:\n", H.round(3))
'''
caveats = [
    "scipy.differentiate is new (SciPy 1.15+). f must accept and return ARRAYS (it is evaluated at many points at once); a scalar-only Python function fails. Older code uses scipy.optimize.approx_fprime (gradient only).",
    "For jacobian/hessian the variables are on axis 0 of x, and f must handle extra trailing axes (see the broadcasting in the example).",
    "Inverting the Hessian of a negative log-likelihood at the MLE gives the covariance of the estimates (like solve(optimHess(...))).",
]
see_also = ["minimize", "sympy-diff", "curve-fit"]
docs = "https://docs.scipy.org/doc/scipy/reference/differentiate.html"

[[entry]]
id = "np-fft"
title = "Fast Fourier transform and convolution"
kind = "compute"
library = "NumPy"
import = "import numpy as np\nfrom scipy.signal import fftconvolve"
call = "np.fft.fft(x); np.fft.ifft(X); fftconvolve(a, b)"
aliases = ["fft", "fourier transform", "spectrum", "periodogram", "convolution", "convolve", "inverse fft"]
r = ["fft", "mvfft", "convolve", "spec.pgram"]
inputs = "1-D array (real or complex); for convolution two arrays."
returns = "Complex array of Fourier coefficients (same length); fftconvolve returns the full convolution (length len(a) + len(b) - 1)."
example = '''
import numpy as np
from scipy.signal import fftconvolve

t = np.arange(64)
x = np.sin(2 * np.pi * 4 * t / 64)
X = np.fft.fft(x)                                    # same as R fft(x)
print("peak frequency index:", int(np.argmax(np.abs(X[:32]))))
assert np.allclose(np.fft.ifft(X).real, x)          # ifft already divides by n

print(fftconvolve([1.0, 2.0, 3.0], [0.0, 1.0, 0.5]).round(6))   # = np.convolve
'''
caveats = [
    "R fft(X, inverse = TRUE) is UNnormalized (you divide by length yourself); np.fft.ifft already divides by n.",
    "R convolve(x, y, type = 'open') reverses y; the ordinary convolution is np.convolve(x, y) or fftconvolve (faster for long inputs).",
    "Real input: np.fft.rfft returns only the non-negative frequencies; np.fft.fftfreq(n, d) gives the frequency of each coefficient.",
]
see_also = ["np-matmul"]
docs = "https://numpy.org/doc/stable/reference/routines.fft.html"
