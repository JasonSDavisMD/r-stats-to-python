[[entry]]
id = "np-qr"
title = "QR decomposition of a matrix"
kind = "compute"
library = "NumPy"
import = "import numpy as np"
call = "Q, R = np.linalg.qr(X)"
aliases = ["qr", "qr decomposition", "orthogonal triangular decomposition", "least squares via qr"]
r = ["qr", "qr.Q", "qr.R", "qr.solve"]
inputs = "2-D array X (n x p)."
returns = "Q (n x p, orthonormal columns) and R (p x p, upper triangular); X = Q @ R."
example = '''
import numpy as np
from scipy.linalg import solve_triangular

rng = np.random.default_rng(9)
X = np.column_stack([np.ones(30), rng.normal(size=(30, 2))])
y = X @ np.array([1.0, 2.0, -1.0]) + rng.normal(0, 0.1, 30)

Q, R = np.linalg.qr(X)                       # reduced ("thin") QR by default
beta = solve_triangular(R, Q.T @ y)          # least squares, like qr.solve(X, y)
print(beta.round(3))
assert np.allclose(Q @ R, X) and np.allclose(beta, np.linalg.lstsq(X, y)[0])
'''
caveats = [
    "NumPy returns Q and R directly; R's qr() returns a compact object you unpack with qr.Q / qr.R.",
    "No column pivoting in np.linalg.qr (R's LINPACK qr pivots rank-deficient columns). For pivoting use scipy.linalg.qr(X, pivoting=True).",
    "Signs of Q columns / R rows may differ from R.",
]
see_also = ["np-svd", "np-cholesky", "np-lstsq", "np-solve"]
docs = "https://numpy.org/doc/stable/reference/generated/numpy.linalg.qr.html"

[[entry]]
id = "np-cholesky"
title = "Cholesky decomposition of a positive definite matrix"
kind = "compute"
library = "NumPy"
import = "import numpy as np"
call = "L = np.linalg.cholesky(S)"
aliases = ["cholesky", "chol", "cholesky factor", "square root of covariance matrix", "correlated normal draws"]
r = ["chol", "chol2inv"]
inputs = "Symmetric positive definite 2-D array S (e.g. a covariance matrix)."
returns = "LOWER triangular L with S = L @ L.T (raises LinAlgError if S is not positive definite)."
example = '''
import numpy as np

S = np.array([[4.0, 1.2], [1.2, 1.0]])
L = np.linalg.cholesky(S)                  # LOWER triangular
R_chol = L.T                               # what R's chol(S) returns (upper)
print(L)
assert np.allclose(L @ L.T, S) and np.allclose(R_chol.T @ R_chol, S)

rng = np.random.default_rng(10)
z = rng.standard_normal((5000, 2))
draws = z @ L.T                            # rows ~ N(0, S)
print(np.cov(draws, rowvar=False).round(2))
'''
caveats = [
    "R chol() returns the UPPER triangle R with S = t(R) %*% R; NumPy returns the LOWER triangle L = t(R). Transpose to match. (NumPy 2 also accepts upper=True.)",
    "scipy.linalg.cholesky defaults to upper (lower=False), the same as R, so the two Python functions disagree with each other.",
    "chol2inv equivalent: scipy.linalg.cho_solve((L, True), np.eye(n)).",
]
see_also = ["np-svd", "np-qr", "mvn-logpdf", "np-eigvalsh"]
docs = "https://numpy.org/doc/stable/reference/generated/numpy.linalg.cholesky.html"

