id = "sobol-qmc"
title = "Quasi-Monte Carlo (Sobol / Halton / Latin hypercube) sample points"
kind = "compute"
library = "SciPy"
import = "from scipy.stats import qmc"
call = "qmc.Sobol(d=2, scramble=True, rng=rng).random_base2(m=10)"
aliases = ["sobol", "sobol sequence", "quasi monte carlo", "low discrepancy sequence", "halton", "latin hypercube", "space filling design"]
r = ["randtoolbox::sobol", "randtoolbox::halton", "lhs::randomLHS", "qrng::sobol"]
inputs = "Dimension d; rng= a Generator (for scrambling); number of points 2**m."
returns = "Array (n, d) in the unit cube [0, 1)^d; rescale with qmc.scale(sample, lower, upper)."
example = '''
import numpy as np
from scipy.stats import qmc, norm

rng = np.random.default_rng(12)
sampler = qmc.Sobol(d=2, scramble=True, rng=rng)
u = sampler.random_base2(m=10)                 # 2**10 = 1024 points
print(u.shape, "discrepancy:", qmc.discrepancy(u))

z = norm.ppf(u)                                 # map to standard normals
estimate = np.mean(z[:, 0] ** 2 + z[:, 1] ** 2) # E[X^2 + Y^2] = 2
print(estimate)
assert abs(estimate - 2) < 0.05
'''
