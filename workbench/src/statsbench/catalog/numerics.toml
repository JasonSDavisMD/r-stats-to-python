id = "sparse-matrix"
title = "Sparse matrices (mostly zeros): build, multiply, solve"
kind = "compute"
library = "SciPy"
import = "import scipy.sparse as sp\nfrom scipy.sparse.linalg import spsolve"
call = "A = sp.csr_array((values, (rows, cols)), shape=(n, p))"
aliases = ["sparse", "sparse matrix", "sparsematrix", "csr", "large mostly zero matrix", "sparse linear system", "dgcmatrix"]
r = ["Matrix::sparseMatrix", "Matrix::Matrix(sparse = TRUE)", "Matrix::solve"]
inputs = "Triplets (values, (row_idx, col_idx)) with 0-based indices, or a dense array; shape."
returns = "csr_array; supports @, .T, .sum(axis), .toarray(); spsolve for A x = b."
example = '''
import numpy as np
import scipy.sparse as sp
from scipy.sparse.linalg import spsolve

n = 1000
main = 2.0 * np.ones(n)
off = -1.0 * np.ones(n - 1)
A = sp.diags_array([off, main, off], offsets=[-1, 0, 1], format="csr")   # tridiagonal
print(type(A).__name__, A.shape, "stored non-zeros:", A.nnz)

b = np.ones(n)
x = spsolve(A, b)
assert np.allclose(A @ x, b)

T = sp.csr_array(([5.0, 7.0], ([0, 2], [1, 0])), shape=(3, 3))       # triplet form, 0-based
print(T.toarray())
'''
caveats = [
    "Indices are 0-based (Matrix::sparseMatrix(i, j, x) is 1-based).",
    "Use the *_array classes (csr_array, diags_array); the older *_matrix classes make * mean matrix product. With arrays, * is ELEMENTWISE and @ is matrix product.",
    "Never call np.linalg functions on a sparse array; use scipy.sparse.linalg (spsolve, eigsh, svds) or .toarray() for small ones.",
]
see_also = ["np-solve", "np-matmul"]
docs = "https://docs.scipy.org/doc/scipy/reference/sparse.html"

