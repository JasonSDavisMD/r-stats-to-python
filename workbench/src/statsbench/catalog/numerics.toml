    "scipy.interpolate.interp1d is LEGACY (documented as not recommended); use np.interp for linear and make_interp_spline / CubicSpline / PchipInterpolator for smooth curves.",
    "np.interp holds the end values outside the data range, like approx(rule = 2); R approx default rule = 1 gives NA. A BSpline extrapolates by default.",
    "End conditions differ: make_interp_spline and CubicSpline default to 'not-a-knot'; R spline()/splinefun() default to method = 'fmm'. Use bc_type='natural' for method = 'natural'.",
    "Interpolation passes THROUGH the points; to smooth noisy data use a smoothing spline instead.",
]
