[[entry]]
id = "interp-spline"
title = "Interpolate between data points (linear or cubic interpolating spline)"
kind = "compute"
library = "SciPy"
import = "import numpy as np\nfrom scipy.interpolate import make_interp_spline"
call = "make_interp_spline(x, y, k=3)(x_new)   # linear: np.interp(x_new, x, y)"
aliases = ["interpolate", "interpolation", "linear interpolation", "cubic interpolation", "interp1d", "approx", "approxfun", "fill between points", "cubic spline interpolation"]
r = ["approx", "approxfun", "splinefun"]
inputs = "x strictly increasing, y same length; k = spline degree (1 linear, 3 cubic); new x values."
returns = "BSpline (callable; .derivative(), .antiderivative()). np.interp returns an array directly."
example = '''
import numpy as np
from scipy.interpolate import make_interp_spline

x = np.array([0.0, 1.0, 2.0, 3.0, 4.0])
y = x ** 3
x_new = np.array([0.5, 1.5, 2.5])

lin = np.interp(x_new, x, y)                  # approx(x, y, xout = x_new)
cubic = make_interp_spline(x, y, k=3)          # passes through every point exactly
print(lin, cubic(x_new))
assert np.allclose(cubic(x_new), x_new ** 3)   # cubic data recovered exactly
'''
