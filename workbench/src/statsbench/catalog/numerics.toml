    "NumPy's default method='linear' equals R's default type = 7, so plain calls agree.",
    "Name map: type 1 'inverted_cdf', 2 'averaged_inverted_cdf', 3 'closest_observation', 4 'interpolated_inverted_cdf', 5 'hazen', 6 'weibull', 7 'linear', 8 'median_unbiased', 9 'normal_unbiased'.",
    "The old keyword interpolation= is deprecated; use method=.",
    "NaN in x gives NaN (R errors unless na.rm = TRUE); use np.nanquantile. pandas Series.quantile also defaults to type 7.",
]
