id = "quad-integrate"
title = "Numerical integration of a function over an interval (definite integral)"
kind = "compute"
library = "SciPy"
import = "import numpy as np\nfrom scipy.integrate import quad"
call = "value, abs_error = quad(f, lower, upper)"
aliases = ["integrate", "numerical integration", "definite integral", "area under a curve", "quadrature", "expected value by integration"]
r = ["integrate"]
inputs = "f(x) -> float; limits (may be -np.inf / np.inf); extra parameters via args=(...)."
returns = "Tuple (value, estimated absolute error)."
example = '''
import numpy as np
from scipy.integrate import quad
from scipy.stats import norm

value, err = quad(norm.pdf, -np.inf, 1.96)          # integrate(dnorm, -Inf, 1.96)
print(value, err)
assert np.isclose(value, norm.cdf(1.96))

mean_gamma, _ = quad(lambda x, k: x * x ** (k - 1) * np.exp(-x), 0, np.inf, args=(3.0,))
print("E[X] * Gamma(3):", mean_gamma)                 # = Gamma(4) = 6
'''
caveats = [
    "Returns a plain tuple, not an object: R's integrate(...)$value is quad(...)[0].",
    "Integrating data points (not a function)? Use np.trapezoid(y, x) or scipy.integrate.simpson; np.trapz was removed in NumPy 2.",
    "Sharp peaks far from the bulk of an infinite range can be missed (same as R); split the range or pass points= for finite ranges.",
]
see_also = ["solve-ivp", "norm-dist"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.integrate.quad.html"

[[entry]]
id = "solve-ivp"
title = "Solve a system of ordinary differential equations (ODE initial value problem)"
kind = "compute"
library = "SciPy"
import = "from scipy.integrate import solve_ivp"
call = "solve_ivp(fun, (t0, t1), y0, t_eval=times, args=(params,))"
aliases = ["ode", "differential equation", "ode solver", "compartment model", "pharmacokinetic model", "sir model", "initial value problem"]
r = ["deSolve::ode", "deSolve::lsoda"]
inputs = "fun(t, y, *args) -> dy/dt array; time span (t0, t1); initial state y0; t_eval = output times."
returns = "OdeResult: .t (times), .y (shape (n_states, n_times)), .success, .message."
example = '''
import numpy as np
from scipy.integrate import solve_ivp

def one_compartment(t, y, ka, ke):        # oral dose: gut -> plasma -> eliminated
    gut, plasma = y
    return [-ka * gut, ka * gut - ke * plasma]

sol = solve_ivp(one_compartment, (0, 24), [100.0, 0.0], t_eval=[0, 1, 2, 4, 8, 24],
                args=(1.0, 0.2), method="LSODA", rtol=1e-8, atol=1e-10)
print(sol.success, np.round(sol.y[1], 2))   # plasma amount at each time
assert sol.success and np.isclose(sol.y[0, -1], 100 * np.exp(-24), atol=1e-6)
'''
caveats = [
    "Argument order is fun(t, y) and it returns just the derivative array; deSolve uses func(t, y, parms) returning list(dy).",
    "Default method is 'RK45' with rtol=1e-3, much looser than deSolve (lsoda, rtol=1e-6). Set method='LSODA' (or 'BDF' for stiff systems) and tighten rtol/atol.",
    "Without t_eval you get the solver's own step times, not a regular grid.",
    "Results are rows = states, columns = times (deSolve returns times as rows); use sol.y.T to get R's layout.",
]
see_also = ["quad-integrate", "curve-fit"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.integrate.solve_ivp.html"

