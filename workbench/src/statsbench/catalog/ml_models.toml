[[entry]]
id = "column-transformer"
title = "Mixed numeric and categorical data: ColumnTransformer + OneHotEncoder in a pipeline"
kind = "compute"
library = "scikit-learn"
import = "from sklearn.compose import ColumnTransformer\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.pipeline import make_pipeline"
call = "ColumnTransformer([('num', StandardScaler(), num_cols), ('cat', OneHotEncoder(handle_unknown='ignore'), cat_cols)])"
aliases = ["one hot encoding", "dummy variables", "categorical predictors", "factor variables sklearn", "mixed data types", "encode categorical features", "columntransformer", "onehotencoder", "model matrix"]
r = ["model.matrix", "recipes::step_dummy", "recipes::step_normalize", "fastDummies::dummy_cols"]
inputs = "pandas DataFrame; lists of numeric and categorical column names."
returns = "Transformer producing one numeric matrix; get_feature_names_out() names the dummy columns. Used as the first step of a Pipeline."
example = '''
import numpy as np
import pandas as pd
from sklearn.compose import ColumnTransformer
from sklearn.linear_model import LogisticRegression
from sklearn.pipeline import make_pipeline
from sklearn.preprocessing import OneHotEncoder, StandardScaler

rng = np.random.default_rng(46)
n = 300
df = pd.DataFrame({
    "age": rng.normal(40, 10, n),
    "income": rng.normal(50, 15, n),
    "region": rng.choice(["north", "south", "west"], n),
})
y = (0.05 * (df["age"] - 40) + (df["region"] == "west") + rng.normal(0, 1, n) > 0.3).astype(int)
prep = ColumnTransformer([
    ("num", StandardScaler(), ["age", "income"]),
    ("cat", OneHotEncoder(drop="first", handle_unknown="ignore"), ["region"]),
])
model = make_pipeline(prep, LogisticRegression()).fit(df, y)
names = model[0].get_feature_names_out()
print(dict(zip(names, model[-1].coef_[0].round(3))))
new = pd.DataFrame({"age": [30.0], "income": [60.0], "region": ["west"]})
print("P(y=1):", model.predict_proba(new)[0, 1].round(3))
assert len(names) == 4
'''
caveats = [
    "OneHotEncoder default keeps ALL levels (drop=None) -- fine for penalized/tree models, but collinear with the intercept; drop='first' mimics R's treatment contrasts (baseline = first level alphabetically).",
    "handle_unknown='ignore' makes unseen test levels all-zero instead of raising; R's predict() errors on new factor levels.",
    "Fit the whole pipeline on training data only, so scaling and levels are learned without test leakage.",
    "Columns not listed are DROPPED by default (remainder='drop'); use remainder='passthrough' to keep them.",
]
see_also = ["sk-pipeline", "standard-scaler", "df-categorical", "missing-value-imputation"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.compose.ColumnTransformer.html"

[[entry]]
id = "missing-value-imputation"
title = "Impute missing values (mean/median, KNN, iterative/MICE-style)"
kind = "compute"
library = "scikit-learn"
import = "from sklearn.impute import KNNImputer, SimpleImputer\nfrom sklearn.experimental import enable_iterative_imputer  # noqa: F401\nfrom sklearn.impute import IterativeImputer"
call = "SimpleImputer(strategy='median').fit_transform(X)"
aliases = ["imputation", "impute missing values", "fill missing values", "missing data", "na imputation", "knn imputation", "iterative imputer", "multiple imputation", "mice", "simpleimputer"]
r = ["mice::mice", "VIM::kNN", "Hmisc::impute", "recipes::step_impute_median", "missForest"]
inputs = "Numeric X with np.nan for missing (DataFrames with NaN work)."
returns = "Array with NaN filled. add_indicator=True appends missing-indicator columns."
example = '''
import numpy as np
from sklearn.experimental import enable_iterative_imputer  # noqa: F401  (must come first)
from sklearn.impute import IterativeImputer, KNNImputer, SimpleImputer

rng = np.random.default_rng(47)
x1 = rng.normal(size=200)
X = np.column_stack([x1, 2 * x1 + rng.normal(scale=0.3, size=200), rng.normal(size=200)])
truth = X.copy()
mask = rng.random(X.shape) < 0.15
X[mask] = np.nan
for name, imp in [
    ("median", SimpleImputer(strategy="median")),
    ("knn", KNNImputer(n_neighbors=5)),
    ("iterative", IterativeImputer(max_iter=10, random_state=0)),
]:
    filled = imp.fit_transform(X)
    rmse = np.sqrt(np.mean((filled[mask] - truth[mask]) ** 2))
    print(f"{name:9s} RMSE on imputed cells: {rmse:.3f}")
assert not np.isnan(filled).any()
'''
caveats = [
    "IterativeImputer is experimental: you MUST run `from sklearn.experimental import enable_iterative_imputer` before importing it.",
    "IterativeImputer returns ONE completed dataset (default BayesianRidge, sample_posterior=False) -- not mice's m multiply-imputed datasets with pooled inference. For Rubin's rules use statsmodels.imputation.mice.",
    "Put the imputer inside a Pipeline so it is fitted on training folds only.",
    "SimpleImputer(strategy='most_frequent') handles categorical columns; KNNImputer is distance based, so scale first.",
]
see_also = ["column-transformer", "sk-pipeline", "df-dropna", "hist-gradient-boosting"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.impute.IterativeImputer.html"

[[entry]]
id = "classification-report"
title = "Classification report: precision, recall and F1 per class"
kind = "evaluate"
library = "scikit-learn"
import = "from sklearn.metrics import classification_report, f1_score, precision_score, recall_score"
call = "classification_report(y_true, y_pred, digits=3)"
aliases = ["precision recall f1", "f1 score", "precision", "recall", "classification metrics", "per class accuracy", "macro average", "positive predictive value"]
r = ["caret::confusionMatrix(mode = 'everything')", "yardstick::f_meas", "MLmetrics::F1_Score"]
inputs = "True labels and predicted labels (class decisions, not probabilities)."
returns = "classification_report: formatted text (output_dict=True for a dict); precision_score etc.: floats."
example = '''
from sklearn.datasets import make_classification
from sklearn.linear_model import LogisticRegression
from sklearn.metrics import classification_report, f1_score, precision_score, recall_score
from sklearn.model_selection import train_test_split

X, y = make_classification(n_samples=500, n_features=5, weights=[0.7, 0.3], random_state=48)
X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, stratify=y, random_state=0)
y_pred = LogisticRegression().fit(X_train, y_train).predict(X_test)
print(classification_report(y_test, y_pred, digits=3))
p, r, f = precision_score(y_test, y_pred), recall_score(y_test, y_pred), f1_score(y_test, y_pred)
print(f"precision={p:.3f} recall={r:.3f} F1={f:.3f}")
assert abs(f - 2 * p * r / (p + r)) < 1e-12
'''
caveats = [
    "precision_score / recall_score / f1_score default to pos_label=1 (binary). caret's positive class is the FIRST factor level -- often the other class.",
    "Recall of the positive class = sensitivity; recall of the negative class = specificity.",
    "Multiclass needs average= ('macro', 'weighted', 'micro'); the report prints all three.",
    "Undefined precision (no predicted positives) returns 0 with an UndefinedMetricWarning; set zero_division= to control it.",
]
see_also = ["confusion-matrix", "precision-recall-curve", "roc-auc", "class-imbalance"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.metrics.classification_report.html"

[[entry]]
id = "precision-recall-curve"
title = "Precision-recall curve and average precision (PR AUC)"
kind = "evaluate"
library = "scikit-learn"
import = "from sklearn.metrics import average_precision_score, precision_recall_curve, PrecisionRecallDisplay"
call = "precision_recall_curve(y_true, probability)"
aliases = ["pr curve", "precision recall curve", "average precision", "pr auc", "area under precision recall", "precision recall tradeoff"]
r = ["PRROC::pr.curve", "yardstick::pr_curve", "yardstick::pr_auc", "ROCR::performance(pred, 'prec', 'rec')"]
inputs = "True 0/1 labels; predicted probabilities or scores for the positive class."
returns = "precision, recall, thresholds arrays; average_precision_score returns a float."
example = '''
import matplotlib.pyplot as plt
from sklearn.datasets import make_classification
from sklearn.linear_model import LogisticRegression
from sklearn.metrics import PrecisionRecallDisplay, average_precision_score, precision_recall_curve
from sklearn.model_selection import train_test_split

X, y = make_classification(n_samples=500, n_features=5, weights=[0.85, 0.15], random_state=49)
X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, stratify=y, random_state=0)
prob = LogisticRegression().fit(X_train, y_train).predict_proba(X_test)[:, 1]
precision, recall, thresholds = precision_recall_curve(y_test, prob)
ap = average_precision_score(y_test, prob)
print("average precision:", round(ap, 3), "baseline (prevalence):", round(y_test.mean(), 3))
fig, ax = plt.subplots()
PrecisionRecallDisplay.from_predictions(y_test, prob, ax=ax)
plt.close(fig)
assert ap > y_test.mean()
'''
caveats = [
    "Pass probabilities, not predicted classes.",
    "average_precision_score is a step-wise sum, not the trapezoidal area; PRROC's integral / yardstick pr_auc can differ slightly.",
    "precision and recall have one more element than thresholds (the final point precision=1, recall=0).",
    "The no-skill baseline is the positive-class prevalence (not 0.5 as for ROC); prefer PR curves for rare positives.",
]
see_also = ["roc-auc", "classification-report", "class-imbalance"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.metrics.precision_recall_curve.html"

[[entry]]
id = "probability-calibration"
title = "Probability calibration: calibration curve and CalibratedClassifierCV"
kind = "evaluate"
library = "scikit-learn"
import = "from sklearn.calibration import CalibratedClassifierCV, CalibrationDisplay, calibration_curve"
call = "calibration_curve(y_true, probability, n_bins=10)"
aliases = ["calibration curve", "reliability diagram", "calibrate probabilities", "platt scaling", "isotonic calibration", "brier score", "calibration plot"]
r = ["caret::calibration", "rms::val.prob", "rms::calibrate", "CalibrationCurves::val.prob.ci.2"]
inputs = "True 0/1 labels and predicted probabilities; or a classifier to wrap in CalibratedClassifierCV."
returns = "calibration_curve: (prob_true, prob_pred) per bin; CalibratedClassifierCV: fitted classifier with calibrated .predict_proba."
example = '''
import matplotlib.pyplot as plt
from sklearn.calibration import CalibratedClassifierCV, CalibrationDisplay, calibration_curve
from sklearn.datasets import make_classification
from sklearn.metrics import brier_score_loss
from sklearn.model_selection import train_test_split
from sklearn.naive_bayes import GaussianNB

X, y = make_classification(n_samples=2000, n_features=10, n_informative=4, n_redundant=4, random_state=50)
X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.4, random_state=0)
raw = GaussianNB().fit(X_train, y_train).predict_proba(X_test)[:, 1]
cal = CalibratedClassifierCV(GaussianNB(), method="isotonic", cv=5).fit(X_train, y_train)
calibrated = cal.predict_proba(X_test)[:, 1]
prob_true, prob_pred = calibration_curve(y_test, calibrated, n_bins=10)
print("observed vs predicted per bin:\n", prob_true.round(2), "\n", prob_pred.round(2))
b_raw, b_cal = brier_score_loss(y_test, raw), brier_score_loss(y_test, calibrated)
print("Brier raw:", round(b_raw, 4), "calibrated:", round(b_cal, 4))
fig, ax = plt.subplots()
CalibrationDisplay.from_predictions(y_test, calibrated, n_bins=10, ax=ax)
plt.close(fig)
assert b_cal < b_raw
'''
caveats = [
    "calibration_curve returns (prob_true, prob_pred) -- observed frequency FIRST.",
    "Default strategy='uniform' uses equal-width bins; strategy='quantile' gives equal-count bins (like deciles in many R plots).",
    "CalibratedClassifierCV default method='sigmoid' (Platt); 'isotonic' needs more data. Calibrate on data not used to fit the model (cv= does this).",
    "This is also the replacement for the deprecated SVC(probability=True): CalibratedClassifierCV(SVC(), ensemble=False).",
]
