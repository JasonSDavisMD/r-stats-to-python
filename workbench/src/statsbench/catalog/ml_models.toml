id = "svm"
title = "Support vector machine classifier (SVC) with kernels and probabilities"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.svm import SVC\nfrom sklearn.calibration import CalibratedClassifierCV"
call = "SVC(kernel='rbf', C=1.0, gamma='scale').fit(X_train, y_train)"
aliases = ["support vector machine", "support vector classifier", "svc", "svm classifier", "kernel svm", "radial kernel", "linear svm", "polynomial kernel", "svm probability"]
r = ["e1071::svm", "kernlab::ksvm", "svm"]
inputs = "X (n, p) numeric (scale it), y labels; kernel ('linear', 'rbf', 'poly', 'sigmoid'), C, gamma, degree."
returns = "Fitted estimator: .predict, .decision_function, .support_vectors_, .n_support_. Probabilities via CalibratedClassifierCV(SVC(), ensemble=False)."
example = '''
from sklearn.calibration import CalibratedClassifierCV
from sklearn.datasets import make_moons
from sklearn.model_selection import train_test_split
from sklearn.pipeline import make_pipeline
from sklearn.preprocessing import StandardScaler
from sklearn.svm import SVC

X, y = make_moons(n_samples=300, noise=0.2, random_state=42)
X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, random_state=0)
svm = make_pipeline(StandardScaler(), SVC(kernel="rbf", C=1.0, gamma="scale")).fit(X_train, y_train)
acc = svm.score(X_test, y_test)
print("rbf accuracy:", round(acc, 3), "support vectors per class:", svm[-1].n_support_)
# SVC(probability=True) is deprecated in scikit-learn 1.9; calibrate instead:
prob_svm = CalibratedClassifierCV(make_pipeline(StandardScaler(), SVC(kernel="rbf")), ensemble=False, cv=5)
prob_svm.fit(X_train, y_train)
print("P(class 1), first 3 test rows:", prob_svm.predict_proba(X_test[:3])[:, 1].round(3))
assert acc > 0.8
'''
caveats = [
    "C here is e1071's cost (default 1 in both). Larger C = less regularization; this is the OPPOSITE of the ISLR 'budget' C.",
    "e1071::svm scales inputs by default (scale = TRUE); SVC does NOT. Put StandardScaler in a Pipeline.",
    "gamma default 'scale' = 1 / (p * X.var()); e1071's default is 1 / p (for scaled data these match).",
    "SVC(probability=True) is deprecated in scikit-learn 1.9 (removed in 1.11). Use CalibratedClassifierCV(SVC(), ensemble=False) for predict_proba; decision_function is available without it.",
    "For large n with a linear kernel, LinearSVC is much faster. Regression: sklearn.svm.SVR (e1071::svm with numeric y).",
]
see_also = ["probability-calibration", "standard-scaler", "grid-search-cv", "decision-boundary-display"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.svm.SVC.html"

