id = "hist-gradient-boosting"
title = "Gradient boosting (histogram-based) classifier and regressor"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.ensemble import HistGradientBoostingClassifier, HistGradientBoostingRegressor"
call = "HistGradientBoostingClassifier(learning_rate=0.1, max_iter=200, random_state=0).fit(X, y)"
aliases = ["gradient boosting", "boosted trees", "gradient boosted machine", "histgradientboosting", "lightgbm style boosting", "boosting with missing values", "xgboost alternative"]
r = ["gbm::gbm", "xgboost::xgboost", "lightgbm::lgb.train"]
inputs = "X (n, p), may contain NaN (handled natively) and pandas category columns; y."
returns = "Fitted estimator: .predict, .predict_proba (classifier), .n_iter_ (trees actually used with early stopping)."
example = '''
import numpy as np
from sklearn.datasets import make_classification
from sklearn.ensemble import HistGradientBoostingClassifier, HistGradientBoostingRegressor
from sklearn.model_selection import train_test_split

X, y = make_classification(n_samples=500, n_features=6, n_informative=4, random_state=44)
rng = np.random.default_rng(44)
X[rng.random(X.shape) < 0.1] = np.nan              # 10% missing, no imputation needed
X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=0)
hgb = HistGradientBoostingClassifier(learning_rate=0.1, max_iter=200, random_state=0).fit(X_train, y_train)
acc = hgb.score(X_test, y_test)
print("test accuracy:", round(acc, 3), "trees used:", hgb.n_iter_)
x = rng.uniform(-2, 2, size=(300, 2))
reg = HistGradientBoostingRegressor(max_iter=100).fit(x, x[:, 0] ** 2 + x[:, 1])
print("regressor R^2 (train):", round(reg.score(x, x[:, 0] ** 2 + x[:, 1]), 3))
assert acc > 0.75
'''
caveats = [
    "EARLY STOPPING IS ON by default when n > 10000 (early_stopping='auto'); then 10% of the data is held out. Set early_stopping=False for a fixed number of trees like gbm's n.trees.",
    "Parameter names: gbm n.trees = max_iter, shrinkage = learning_rate (gbm default 0.1 same), interaction.depth ~ max_depth (default None; trees are limited by max_leaf_nodes=31), n.minobsinnode = min_samples_leaf (default 20 vs 10).",
    "NaN is handled natively (like xgboost); GradientBoostingClassifier (the older, slower class) does not accept NaN.",
    "No built-in relative influence plot; use permutation_importance.",
]
see_also = ["random-forest", "permutation-importance", "partial-dependence", "missing-value-imputation"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.ensemble.HistGradientBoostingClassifier.html"

