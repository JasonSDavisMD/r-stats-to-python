    "var_ are ML variances (divide by n) plus a tiny var_smoothing; e1071 reports sample sds (n - 1). Numbers differ slightly.",
    "GaussianNB needs numeric features only. e1071::naiveBayes handles factors automatically; in sklearn use CategoricalNB for categorical columns (ordinal-encoded).",
    "No Laplace smoothing argument in GaussianNB; alpha= is on MultinomialNB/CategoricalNB (e1071 laplace = 0 default vs sklearn alpha=1.0).",
]
