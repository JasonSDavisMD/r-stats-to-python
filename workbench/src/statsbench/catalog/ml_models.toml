[[entry]]
id = "permutation-importance"
title = "Permutation variable importance (model-agnostic)"
kind = "evaluate"
library = "scikit-learn"
import = "from sklearn.inspection import permutation_importance"
call = "permutation_importance(model, X_test, y_test, n_repeats=10, random_state=0)"
aliases = ["permutation importance", "feature importance", "variable importance plot", "model agnostic importance", "vip", "which predictors matter"]
r = ["vip::vi_permute", "vip::vip", "DALEX::model_parts", "iml::FeatureImp", "randomForest::importance(type = 1)"]
inputs = "A FITTED model, held-out X and y; scoring= (default: the model's .score)."
returns = "Bunch with importances_mean, importances_std, importances (n_features, n_repeats)."
example = '''
import numpy as np
from sklearn.ensemble import HistGradientBoostingRegressor
from sklearn.inspection import permutation_importance
from sklearn.model_selection import train_test_split

rng = np.random.default_rng(51)
X = rng.normal(size=(400, 4))
y = 3 * X[:, 0] + X[:, 1] ** 2 + rng.normal(scale=0.5, size=400)   # x2, x3 are noise
X_train, X_test, y_train, y_test = train_test_split(X, y, random_state=0)
model = HistGradientBoostingRegressor(random_state=0).fit(X_train, y_train)
result = permutation_importance(model, X_test, y_test, n_repeats=10, random_state=0)
order = result.importances_mean.argsort()[::-1]
for j in order:
    print(f"x{j}: {result.importances_mean[j]:.3f} +/- {result.importances_std[j]:.3f}")
assert order[0] == 0
'''
caveats = [
    "Importance = drop in the model's score (R^2 or accuracy by default) when a column is shuffled; DALEX reports increase in LOSS (e.g. RMSE). Same idea, different units.",
    "Compute on held-out data; on training data it rewards overfitting.",
    "Correlated predictors share (and understate) importance.",
    "Tree models' .feature_importances_ is impurity-based (like randomForest type = 2 / gbm relative influence) and biased toward high-cardinality features.",
]
see_also = ["partial-dependence", "random-forest", "hist-gradient-boosting"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.inspection.permutation_importance.html"

[[entry]]
id = "partial-dependence"
title = "Partial dependence and ICE plots"
kind = "visualize"
library = "scikit-learn"
import = "from sklearn.inspection import PartialDependenceDisplay, partial_dependence"
call = "PartialDependenceDisplay.from_estimator(model, X, features=[0, 1], kind='average')"
aliases = ["partial dependence plot", "pdp", "ice plot", "individual conditional expectation", "marginal effect plot", "effect of a predictor"]
r = ["pdp::partial", "iml::FeatureEffect", "DALEX::model_profile", "plotmo", "gbm::plot.gbm"]
inputs = "A fitted model, X (training data), features (indices or column names; a tuple gives a 2-way plot)."
returns = "Display object (.axes_, .figure_); partial_dependence() returns a Bunch with grid_values and average."
example = '''
import matplotlib.pyplot as plt
import numpy as np
from sklearn.ensemble import HistGradientBoostingRegressor
from sklearn.inspection import PartialDependenceDisplay, partial_dependence

rng = np.random.default_rng(52)
X = rng.uniform(-2, 2, size=(400, 3))
y = X[:, 0] ** 2 + 2 * X[:, 1] + rng.normal(scale=0.3, size=400)
model = HistGradientBoostingRegressor(random_state=0).fit(X, y)
pd_x1 = partial_dependence(model, X, features=[1], grid_resolution=20)
slope = np.polyfit(pd_x1["grid_values"][0], pd_x1["average"][0], 1)[0]
print("PD slope for x1 (true 2):", round(slope, 2))
fig, ax = plt.subplots(figsize=(8, 3))
PartialDependenceDisplay.from_estimator(model, X, features=[0, 1], kind="both", subsample=50,
                                        random_state=0, ax=ax)     # PD + ICE lines
plt.close("all")
assert 1.5 < slope < 2.5
'''
caveats = [
    "kind='average' = PDP (pdp::partial); kind='individual' = ICE; kind='both' overlays them. centered=True gives c-ICE.",
    "Default grid is 100 points between the 5th and 95th percentiles (percentiles=(0.05, 0.95)), not the full range as in pdp.",
    "For classifiers the y-axis is predict_proba (or decision_function) of the positive class; use target= for multiclass.",
    "Misleading when predictors are strongly correlated (extrapolates to impossible combinations); ALE plots (not in sklearn) avoid this.",
]
see_also = ["permutation-importance", "hist-gradient-boosting", "random-forest"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.inspection.PartialDependenceDisplay.html"

[[entry]]
id = "learning-curve"
title = "Learning curve and validation curve (bias-variance diagnostics)"
kind = "evaluate"
library = "scikit-learn"
import = "from sklearn.model_selection import learning_curve, validation_curve"
call = "learning_curve(model, X, y, train_sizes=np.linspace(0.1, 1.0, 5), cv=5)"
aliases = ["learning curve", "validation curve", "training set size", "overfitting diagnostics", "bias variance tradeoff", "complexity curve", "train vs validation score"]
r = ["caret::learning_curve_dat", "mlr3::benchmark"]
inputs = "An (unfitted) estimator, X, y; train_sizes (learning_curve) or param_name + param_range (validation_curve); cv."
returns = "learning_curve: train_sizes_abs, train_scores, test_scores ((n_sizes, n_folds) each); validation_curve: train_scores, test_scores."
example = '''
import numpy as np
from sklearn.datasets import make_classification
from sklearn.model_selection import learning_curve, validation_curve
from sklearn.tree import DecisionTreeClassifier

X, y = make_classification(n_samples=400, n_features=8, n_informative=4, random_state=53)
sizes, train_sc, test_sc = learning_curve(
    DecisionTreeClassifier(max_depth=4, random_state=0), X, y,
    train_sizes=np.linspace(0.2, 1.0, 5), cv=5)
print("n:", sizes, "\nCV accuracy:", test_sc.mean(axis=1).round(3))
depths = np.arange(1, 11)
tr, te = validation_curve(DecisionTreeClassifier(random_state=0), X, y,
                          param_name="max_depth", param_range=depths, cv=5)
print("best depth by CV:", depths[te.mean(axis=1).argmax()])
print("train - CV gap at depth 10:", round(tr.mean(axis=1)[-1] - te.mean(axis=1)[-1], 3))
assert tr.mean(axis=1)[-1] >= te.mean(axis=1)[-1]
'''
caveats = [
    "Scores are 'higher is better' (accuracy / R^2 by default). For errors use scoring='neg_mean_squared_error' and flip the sign.",
    "cv=5 for a classifier is StratifiedKFold WITHOUT shuffling; pass cv=KFold(5, shuffle=True, random_state=0) if rows are ordered.",
    "Plot with matplotlib (mean +/- sd across folds), or use LearningCurveDisplay.from_estimator / ValidationCurveDisplay.",
]
see_also = ["cross-val-score", "grid-search-cv", "tree-pruning"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.learning_curve.html"

[[entry]]
id = "class-imbalance"
title = "Imbalanced classes: class_weight='balanced' and stratified splits"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.model_selection import StratifiedKFold, train_test_split\nfrom sklearn.linear_model import LogisticRegression"
call = "LogisticRegression(class_weight='balanced').fit(X_train, y_train)"
aliases = ["class imbalance", "imbalanced data", "unbalanced classes", "rare events classification", "class weights", "stratified split", "stratified k fold", "oversampling smote", "cost sensitive learning"]
r = ["caret::trainControl(sampling = 'down')", "ROSE::ROSE", "themis::step_smote", "DMwR::SMOTE", "glm(weights = w)"]
inputs = "X, y with a rare class; most sklearn classifiers accept class_weight= (or sample_weight in fit)."
returns = "A classifier whose loss upweights the rare class by n / (n_classes * count)."
example = '''
import numpy as np
from sklearn.datasets import make_classification
from sklearn.linear_model import LogisticRegression
from sklearn.metrics import balanced_accuracy_score, recall_score
from sklearn.model_selection import StratifiedKFold, cross_val_score, train_test_split

X, y = make_classification(n_samples=500, n_features=5, weights=[0.92, 0.08], flip_y=0.01, random_state=54)
X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, stratify=y, random_state=0)
print("positive rate train/test:", y_train.mean().round(3), y_test.mean().round(3))
plain = LogisticRegression().fit(X_train, y_train)
weighted = LogisticRegression(class_weight="balanced").fit(X_train, y_train)
r_plain = recall_score(y_test, plain.predict(X_test))
r_weighted = recall_score(y_test, weighted.predict(X_test))
print("recall of rare class: plain", round(r_plain, 3), "balanced", round(r_weighted, 3))
cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=0)
print("CV balanced accuracy:", cross_val_score(weighted, X, y, cv=cv, scoring="balanced_accuracy").mean().round(3))
print("test balanced accuracy:", round(balanced_accuracy_score(y_test, weighted.predict(X_test)), 3))
assert r_weighted >= r_plain
'''
caveats = [
    "imbalanced-learn (SMOTE, RandomUnderSampler) is NOT installed here; use class_weight='balanced' or sample_weight=, or change the probability threshold.",
    "train_test_split does NOT stratify by default: pass stratify=y. cross_val_score with an integer cv on a classifier already uses StratifiedKFold (unshuffled).",
    "Weighting shifts predicted probabilities away from the true base rate; do not read them as calibrated probabilities.",
    "Judge with recall / precision / balanced accuracy / PR curves, not plain accuracy.",
]
see_also = ["classification-report", "precision-recall-curve", "train-test-split", "cross-val-score"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.utils.class_weight.compute_class_weight.html"
