# Topic: ml_models -- scikit-learn classifiers/regressors beyond trees, preprocessing for mixed data, and model evaluation/interpretation.
# Key distinction: every sklearn model shares fit/predict/predict_proba, but defaults (scaling, penalties, thresholds) are NOT R's defaults.
# Schema and how to add entries: docs/adding-a-topic.md

[[entry]]
id = "knn"
title = "k-nearest neighbors classifier and regressor (KNN)"
kind = "fit"
library = "scikit-learn"
import = "from sklearn.neighbors import KNeighborsClassifier, KNeighborsRegressor"
call = "KNeighborsClassifier(n_neighbors=5).fit(X_train, y_train)"
aliases = ["k nearest neighbors", "k-nearest neighbours", "knn classifier", "knn regression", "nearest neighbor classification", "kneighbors"]
r = ["class::knn", "FNN::knn.reg", "caret::knn3", "knn"]
inputs = "X_train (n, p) numeric (scale it!), y_train; n_neighbors = k."
returns = "Fitted estimator: .predict(X_test), .predict_proba(X_test) (share of the k neighbours in each class), .kneighbors(X)."
example = '''
import numpy as np
from sklearn.datasets import make_classification
from sklearn.model_selection import train_test_split
from sklearn.neighbors import KNeighborsClassifier, KNeighborsRegressor
from sklearn.pipeline import make_pipeline
from sklearn.preprocessing import StandardScaler

X, y = make_classification(n_samples=400, n_features=4, n_informative=3, n_redundant=0, random_state=41)
X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=0)
knn = make_pipeline(StandardScaler(), KNeighborsClassifier(n_neighbors=5)).fit(X_train, y_train)
acc = knn.score(X_test, y_test)                     # class::knn(train, test, cl, k = 5)
print("test accuracy:", round(acc, 3))
rng = np.random.default_rng(41)
x = rng.uniform(0, 6, size=(200, 1))
yr = np.sin(x[:, 0]) + rng.normal(scale=0.2, size=200)
reg = KNeighborsRegressor(n_neighbors=10).fit(x, yr)
print("KNN regression at x=1.5:", reg.predict([[1.5]]).round(3))
assert acc > 0.7
'''
caveats = [
    "class::knn fits and predicts in one call; sklearn separates .fit(train) and .predict(test).",
    "Ties: class::knn breaks ties at random and includes all tied-distance neighbours; sklearn picks deterministically (data order), so results can differ slightly.",
    "Distance-based: standardize features (StandardScaler in a Pipeline) or large-unit columns dominate.",
    "weights='distance' gives inverse-distance weighting (kknn-style); the default is 'uniform'.",
]
see_also = ["standard-scaler", "sk-pipeline", "grid-search-cv"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.neighbors.KNeighborsClassifier.html"

