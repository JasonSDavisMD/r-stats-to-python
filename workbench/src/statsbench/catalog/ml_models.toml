example = '''
import numpy as np
from sklearn.datasets import make_classification
from sklearn.model_selection import train_test_split
from sklearn.naive_bayes import GaussianNB

X, y = make_classification(n_samples=400, n_features=4, n_informative=3, n_redundant=0, random_state=43)
X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.25, random_state=0)
nb = GaussianNB().fit(X_train, y_train)
print("priors:", nb.class_prior_.round(3))
print("class means:\n", nb.theta_.round(2))
print("class sds:\n", np.sqrt(nb.var_).round(2))       # e1071 prints means and sds
acc = nb.score(X_test, y_test)
print("test accuracy:", round(acc, 3))
