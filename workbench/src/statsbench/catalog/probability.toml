[[entry]]
id = "mvn-logpdf"
title = "Multivariate normal density (e.g. LDA/QDA discriminant by hand)"
kind = "evaluate"
library = "SciPy"
import = "from scipy.stats import multivariate_normal"
call = "multivariate_normal(mean=mu, cov=Sigma).logpdf(X)"
aliases = ["gaussian class conditional density", "discriminant function", "multivariate gaussian log density"]
r = ["mvtnorm::dmvnorm"]
inputs = "mean vector (p,), covariance matrix (p, p), points X (n, p)."
returns = "Log density per row of X."
example = '''
import numpy as np
from scipy.stats import multivariate_normal

mu = np.array([0.0, 1.0])
Sigma = np.array([[1.0, 0.3], [0.3, 2.0]])
X = np.array([[0.0, 1.0], [1.0, 0.0]])
log_density = multivariate_normal(mean=mu, cov=Sigma).logpdf(X)
print(log_density)
# Discriminant score for class k: logpdf(x | k) + log(prior_k); pick the max.
'''
see_also = ["lda", "qda"]
recipe = "examples/06_lda_qda.py"
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.multivariate_normal.html"

[[entry]]
id = "rng-draws"
title = "Reproducible random numbers (seeded generator)"
kind = "compute"
library = "NumPy"
import = "import numpy as np"
call = "rng = np.random.default_rng(seed); rng.normal(loc, scale, size)"
aliases = ["set seed", "simulate data", "random normal draws", "random sample", "reproducible randomness"]
r = ["set.seed", "rnorm", "runif", "sample", "rbinom"]
inputs = "seed (int); distribution parameters; size."
returns = "NumPy array of draws."
example = '''
import numpy as np

rng = np.random.default_rng(598)
x = rng.normal(loc=0, scale=1, size=5)        # rnorm(5)
u = rng.uniform(0, 10, size=3)                # runif(3, 0, 10)
idx = rng.choice(100, size=10, replace=False) # sample(100, 10) but 0-based
print(x, u, idx, sep="\n")
'''
caveats = [
    "Pass the same rng object into functions instead of reseeding everywhere; results then reproduce after Restart + Run All.",
    "NumPy's generator is not R's Mersenne-Twister stream: the same seed does not give the same numbers as R.",
    "scikit-learn functions take random_state=<int> for their own reproducibility.",
]
see_also = ["norm-dist", "train-test-split"]
docs = "https://numpy.org/doc/stable/reference/random/generator.html"

[[entry]]
id = "ttest"
title = "t-tests: one-sample, two-sample (Welch/pooled), paired"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.ttest_ind(a, b, equal_var=False)"
aliases = ["two sample t test", "welch test", "paired t test", "compare two means"]
r = ["t.test"]
inputs = "Sample arrays."
returns = "Result object with .statistic, .pvalue, .confidence_interval()."
example = '''
import numpy as np
from scipy import stats

rng = np.random.default_rng(1)
a, b = rng.normal(0, 1, 30), rng.normal(0.5, 1.5, 25)
result = stats.ttest_ind(a, b, equal_var=False)    # Welch, R's default
print(result.statistic, result.pvalue)
print(result.confidence_interval(confidence_level=0.95))
'''
caveats = ["R's t.test defaults to Welch (var.equal = FALSE); SciPy's ttest_ind defaults to equal_var=True. Set it explicitly."]
see_also = ["t-dist"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.ttest_ind.html"
