[[entry]]
id = "pymc-posterior-predictive"
title = "Posterior predictive check: simulate replicated data from the fitted model"
kind = "evaluate"
library = "PyMC"
import = "import pymc as pm\nimport arviz as az"
call = "pm.sample_posterior_predictive(idata, extend_inferencedata=True, random_seed=1) ; az.plot_ppc_dist(idata)"
aliases = ["posterior predictive check", "ppc", "posterior predictive", "simulate from posterior", "bayesian model check", "replicated data", "pp_check"]
r = ["brms::pp_check", "bayesplot::ppc_dens_overlay", "rstanarm::posterior_predict"]
inputs = "The model context and the idata returned by pm.sample."
returns = "Adds a posterior_predictive group with dims (chain, draw, obs); az.plot_ppc_dist overlays replicated and observed densities."
example = '''
import numpy as np
import pymc as pm
import arviz as az
import matplotlib.pyplot as plt

rng = np.random.default_rng(8)
x = rng.normal(size=80)
y = 0.5 + 1.0 * x + rng.standard_t(df=3, size=80)       # heavy-tailed truth

with pm.Model() as model:
    b0 = pm.Normal("b0", 0, 5)
    b1 = pm.Normal("b1", 0, 5)
    sigma = pm.HalfNormal("sigma", 5)
    pm.Normal("y", mu=b0 + b1 * x, sigma=sigma, observed=y)
    idata = pm.sample(draws=300, tune=300, chains=2, cores=1, random_seed=8,
                      progressbar=False, quiet=True)
    pm.sample_posterior_predictive(idata, extend_inferencedata=True, random_seed=8,
                                   progressbar=False)

y_rep = idata.posterior_predictive["y"].values.reshape(-1, len(y))   # (draws, n)
# Bayesian p-value for the maximum |residual-scale| statistic
p_val = (np.abs(y_rep).max(axis=1) >= np.abs(y).max()).mean()
print("replicated data shape:", y_rep.shape, " p-value for max|y|:", p_val)
az.plot_ppc_dist(idata)
plt.close("all")
assert y_rep.shape == (600, 80)
'''
caveats = [
    "Pass extend_inferencedata=True to add the posterior_predictive group to idata; otherwise a new DataTree is returned and az.plot_ppc_dist(idata) cannot find it.",
    "ArviZ 1.x names: plot_ppc_dist (was plot_ppc); for binary outcomes use az.plot_ppc_pava or plot_ppc_rootogram for counts.",
    "For predictions at NEW x values, put x in pm.Data, call pm.set_data({...}) and sample_posterior_predictive(..., predictions=True).",
]
see_also = ["pymc-linear-regression", "pymc-prior-predictive", "arviz-plot-trace"]
docs = "https://www.pymc.io/projects/docs/en/stable/api/generated/pymc.sample_posterior_predictive.html"
requires = ["pymc", "arviz"]
extra = "bayes"

[[entry]]
id = "pymc-prior-predictive"
title = "Prior predictive check: simulate data implied by the priors before fitting"
kind = "evaluate"
library = "PyMC"
import = "import pymc as pm"
call = "prior = pm.sample_prior_predictive(draws=500, random_seed=1)"
aliases = ["prior predictive check", "prior predictive", "simulate from prior", "choose priors", "prior sensitivity", "sample prior"]
r = ["brms::brm(sample_prior = 'only')", "rstanarm::stan_glm(prior_PD = TRUE)"]
inputs = "A model context (observed data may be present; it is ignored for simulation)."
returns = "DataTree with groups prior (parameter draws) and prior_predictive (simulated outcomes, dims (chain, draw, obs))."
example = '''
import numpy as np
import pymc as pm

rng = np.random.default_rng(9)
x = rng.uniform(0, 10, size=50)            # e.g. years of exposure
y = 20 + 1.5 * x + rng.normal(0, 3, size=50)

with pm.Model() as model:
    b0 = pm.Normal("b0", 0, 100)          # very vague priors ...
    b1 = pm.Normal("b1", 0, 100)
    sigma = pm.HalfNormal("sigma", 50)
    pm.Normal("y", mu=b0 + b1 * x, sigma=sigma, observed=y)
    prior = pm.sample_prior_predictive(draws=500, random_seed=9)

y_sim = prior.prior_predictive["y"].values.ravel()
print("groups:", list(prior.children))
print("simulated y 5%/50%/95%:", np.percentile(y_sim, [5, 50, 95]).round(0))
print("observed y range:", y.min().round(1), y.max().round(1))
# The priors allow outcomes hundreds of units away from anything plausible
assert np.percentile(np.abs(y_sim), 95) > 10 * np.abs(y).max()
'''
caveats = [
    "Use this to check that priors produce plausible data (right sign, magnitude) BEFORE seeing the fit; vague priors often imply absurd outcomes.",
    "The draws argument is draws= (PyMC 6); the result is a separate DataTree unless you merge it with the posterior.",
    "Priors are on the parameter scale: for logistic models, a Normal(0, 10) prior on log-odds puts most prior mass on p near 0 or 1.",
]
see_also = ["pymc-posterior-predictive", "pymc-linear-regression"]
docs = "https://www.pymc.io/projects/docs/en/stable/api/generated/pymc.sample_prior_predictive.html"
requires = ["pymc"]
extra = "bayes"
