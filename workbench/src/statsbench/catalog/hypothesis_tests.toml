[[entry]]
id = "ks-test"
title = "Kolmogorov-Smirnov test: two samples or sample vs a distribution"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.ks_2samp(x, y) / stats.kstest(x, stats.norm(loc=mu, scale=sigma).cdf)"
aliases = ["kolmogorov smirnov", "ks test", "compare two distributions", "same distribution test", "goodness of fit continuous distribution", "ecdf distance test"]
r = ["ks.test"]
inputs = "Two arrays (ks_2samp), or an array plus a distribution name/cdf with FULLY specified parameters (kstest)."
returns = "Result with .statistic (D), .pvalue, .statistic_location, .statistic_sign."
example = '''
import numpy as np
from scipy import stats

rng = np.random.default_rng(29)
scanner_a = rng.normal(0, 1, 80)
scanner_b = rng.normal(0.3, 1.4, 70)

two_sample = stats.ks_2samp(scanner_a, scanner_b)
print("D =", round(two_sample.statistic, 3), " p =", round(two_sample.pvalue, 4))

vs_standard_normal = stats.kstest(scanner_a, stats.norm(loc=0, scale=1).cdf)   # parameters given, not estimated
print("vs N(0,1): p =", round(vs_standard_normal.pvalue, 4))
assert 0 < two_sample.statistic <= 1
'''
caveats = [
    "kstest against a distribution requires KNOWN parameters. Plugging in the sample mean/sd makes p too large; use statsmodels.stats.diagnostic.lilliefors instead.",
    "Pass a frozen distribution's .cdf (stats.norm(loc=0, scale=1).cdf). In SciPy 1.18 the string form kstest(x, 'norm', args=(0, 1)) raises TypeError; kstest(x, 'norm') works only for the standard normal.",
    "ks_2samp method='auto' is exact for small samples, like R's ks.test(exact = NULL).",
    "alternative 'less'/'greater' refer to the CDFs, the same convention as R.",
]
see_also = ["normality-tests", "mann-whitney"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.ks_2samp.html"

