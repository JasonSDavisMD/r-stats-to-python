id = "kruskal-wallis"
title = "Kruskal-Wallis rank test (3+ independent groups)"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.kruskal(group_a, group_b, group_c)"
aliases = ["kruskal wallis", "nonparametric anova", "rank anova", "h test", "compare medians several groups", "nonparametric one way anova"]
r = ["kruskal.test"]
inputs = "Two or more 1-D arrays, one per group (unpacked, not a long data frame)."
returns = "Result with .statistic (H, tie-corrected) and .pvalue (chi-square approximation)."
example = '''
import numpy as np
from scipy import stats

rng = np.random.default_rng(23)
scores = {name: rng.normal(loc, 1, 12).round(1) for name, loc in [("A", 0), ("B", 0.8), ("C", 1.5)]}
result = stats.kruskal(*scores.values())
print("H =", round(result.statistic, 3), " p =", round(result.pvalue, 4))
assert 0 <= result.pvalue <= 1
'''
caveats = [
    "Pass groups as separate arrays. From a long data frame: stats.kruskal(*[g['y'] for _, g in df.groupby('group')]).",
    "Uses the chi-square approximation with tie correction, like R. No built-in post hoc Dunn test (R dunn.test / FSA::dunnTest); use pairwise mann-whitney + multipletests.",
]
see_also = ["mann-whitney", "f-oneway", "multipletests"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.kruskal.html"

[[entry]]
id = "f-oneway"
title = "One-way ANOVA F test (compare means of 3+ groups)"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.f_oneway(group_a, group_b, group_c)"
aliases = ["one way anova", "anova f test", "compare several means", "analysis of variance", "welch anova"]
r = ["aov", "oneway.test", "anova(lm(y ~ group))"]
inputs = "Two or more 1-D arrays, one per group."
returns = "Result with .statistic (F) and .pvalue."
example = '''
import numpy as np
from scipy import stats

rng = np.random.default_rng(24)
groups = [rng.normal(mu, 2.0, 15) for mu in (10, 11, 13)]
result = stats.f_oneway(*groups)
print("F =", round(result.statistic, 3), " p =", round(result.pvalue, 5))

# Hand computation of F = MS_between / MS_within
all_values = np.concatenate(groups)
k, n = len(groups), all_values.size
ss_between = sum(g.size * (g.mean() - all_values.mean()) ** 2 for g in groups)
ss_within = sum(((g - g.mean()) ** 2).sum() for g in groups)
assert np.isclose(result.statistic, (ss_between / (k - 1)) / (ss_within / (n - k)))

print("Welch:", stats.f_oneway(*groups, equal_var=False).pvalue)   # oneway.test default
'''
caveats = [
    "Default equal_var=True matches aov / oneway.test(var.equal = TRUE). R's oneway.test defaults to Welch (var.equal = FALSE): use equal_var=False.",
    "For a formula interface with covariates or factorial designs use statsmodels ols + anova_lm (see anova-lm).",
]
see_also = ["tukey-hsd", "kruskal-wallis", "anova-lm", "equal-variance-tests"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.f_oneway.html"

[[entry]]
id = "tukey-hsd"
title = "Tukey HSD post hoc pairwise comparisons after ANOVA"
kind = "fit"
library = "statsmodels"
import = "from statsmodels.stats.multicomp import pairwise_tukeyhsd"
call = "pairwise_tukeyhsd(endog=values, groups=labels, alpha=0.05)"
aliases = ["tukey honest significant difference", "tukey post hoc", "post hoc test anova", "pairwise comparisons anova", "multiple comparisons of means"]
r = ["TukeyHSD", "TukeyHSD(aov(y ~ group))"]
inputs = "Long format: one array of values and one array of group labels."
returns = "TukeyHSDResults: .summary() table (meandiff, p-adj, lower, upper, reject), .pvalues, .confint."
example = '''
import numpy as np
from scipy import stats
from statsmodels.stats.multicomp import pairwise_tukeyhsd

rng = np.random.default_rng(25)
labels = np.repeat(["ctrl", "low", "high"], 15)
values = np.concatenate([rng.normal(mu, 2.0, 15) for mu in (10, 11, 13)])

tukey = pairwise_tukeyhsd(endog=values, groups=labels, alpha=0.05)
print(tukey.summary())

# SciPy alternative (wide format, groups in the order given)
scipy_result = stats.tukey_hsd(values[labels == "ctrl"], values[labels == "high"], values[labels == "low"])
assert np.allclose(np.sort(tukey.pvalues), np.sort(scipy_result.pvalue[np.triu_indices(3, 1)]), atol=1e-3)
'''
caveats = [
    "Group order in the statsmodels table is alphabetical; meandiff is group2 - group1 (R's TukeyHSD prints the same direction, e.g. 'high-ctrl').",
    "scipy.stats.tukey_hsd(*groups) is the wide-format alternative; its .pvalue is a k x k matrix and .confidence_interval() gives the intervals.",
    "Both assume equal variances. For unequal variances use Games-Howell (pingouin.pairwise_gameshowell, optional).",
]
see_also = ["f-oneway", "multipletests"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.stats.multicomp.pairwise_tukeyhsd.html"

[[entry]]
id = "chi2-contingency"
title = "Chi-square test of independence for a contingency table"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.chi2_contingency(table, correction=True)"
aliases = ["chi square test", "chi-squared test", "chi square independence", "contingency table test", "pearson chi square", "crosstab test", "association between categorical variables", "yates correction"]
r = ["chisq.test"]
inputs = "2-D array of observed COUNTS (e.g. pd.crosstab(df.a, df.b).to_numpy())."
returns = "Result with .statistic, .pvalue, .dof, .expected_freq."
example = '''
import numpy as np
from scipy import stats

# rows: exposed / unexposed; columns: disease yes / no
table = np.array([[30, 70],
                  [18, 82]])
result = stats.chi2_contingency(table)                    # Yates-corrected, like chisq.test
uncorrected = stats.chi2_contingency(table, correction=False)
print("X2 (Yates) =", round(result.statistic, 3), " p =", round(result.pvalue, 4))
print("X2 (no correction) =", round(uncorrected.statistic, 3))
print(result.expected_freq)

expected = np.outer(table.sum(1), table.sum(0)) / table.sum()
assert np.isclose(uncorrected.statistic, ((table - expected) ** 2 / expected).sum())
'''
caveats = [
    "correction=True (Yates) is applied ONLY when dof = 1 (2x2 tables), the same as R's chisq.test(correct = TRUE). Larger tables are never corrected.",
    "Input is a table of counts, not two raw vectors. Build one with pd.crosstab.",
    "SciPy does not warn when expected counts are < 5 (R does). Check .expected_freq; use fisher-exact for small counts.",
    "Goodness of fit to given probabilities (chisq.test(x, p = ...)) is stats.chisquare(observed, f_exp).",
]
see_also = ["fisher-exact", "proportions-ztest", "mcnemar"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.chi2_contingency.html"

[[entry]]
id = "fisher-exact"
title = "Fisher's exact test for a 2x2 (or r x c) table"
kind = "fit"
library = "SciPy"
import = "from scipy import stats\nfrom scipy.stats.contingency import odds_ratio"
call = "stats.fisher_exact(table, alternative='two-sided')"
aliases = ["fisher exact test", "fishers exact", "exact test 2x2", "small counts contingency", "odds ratio exact test"]
r = ["fisher.test"]
inputs = "2-D array of counts."
returns = "Result with .statistic (sample odds ratio for 2x2) and .pvalue."
example = '''
import numpy as np
from scipy import stats
from scipy.stats.contingency import odds_ratio

table = np.array([[8, 2],
                  [3, 9]])
result = stats.fisher_exact(table, alternative="two-sided")
print("sample OR =", round(result.statistic, 3), " p =", round(result.pvalue, 4))

# R's fisher.test reports the CONDITIONAL MLE odds ratio and its exact CI
conditional = odds_ratio(table, kind="conditional")
print("conditional OR =", round(conditional.statistic, 3), conditional.confidence_interval(0.95))
assert np.isclose(result.statistic, (8 * 9) / (2 * 3))
'''
caveats = [
    "The .statistic is the sample odds ratio ad/bc; R's fisher.test prints the conditional MLE. Use scipy.stats.contingency.odds_ratio(table, kind='conditional') for R's estimate and CI. p-values agree.",
    "Tables larger than 2x2 are supported (R x C); the alternative argument then has no effect.",
]
see_also = ["chi2-contingency", "mcnemar"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.fisher_exact.html"

[[entry]]
id = "correlation-test"
title = "Correlation test with p-value: Pearson, Spearman, Kendall"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.pearsonr(x, y) / stats.spearmanr(x, y) / stats.kendalltau(x, y)"
aliases = ["pearson correlation test", "spearman rank correlation", "kendall tau", "correlation p value", "correlation confidence interval", "test correlation significance", "rank correlation"]
r = ["cor.test", "cor.test(method = 'spearman')", "cor.test(method = 'kendall')"]
inputs = "Two equal-length 1-D arrays."
returns = "Result with .statistic (r, rho or tau) and .pvalue; pearsonr also has .confidence_interval()."
example = '''
import numpy as np
from scipy import stats

rng = np.random.default_rng(26)
tumor_size = rng.normal(30, 8, 40)
suv_max = 0.2 * tumor_size + rng.normal(0, 2, 40)

pearson = stats.pearsonr(tumor_size, suv_max)
print("r =", round(pearson.statistic, 3), " p =", pearson.pvalue)
print("95% CI:", pearson.confidence_interval(confidence_level=0.95))   # Fisher z, like R
print("rho =", round(stats.spearmanr(tumor_size, suv_max).statistic, 3))
print("tau-b =", round(stats.kendalltau(tumor_size, suv_max).statistic, 3))
assert np.isclose(pearson.statistic, np.corrcoef(tumor_size, suv_max)[0, 1])
'''
caveats = [
    "Pearson CI uses the Fisher z transform, matching cor.test.",
    "spearmanr p-value uses a t approximation; R's cor.test(method = 'spearman') uses an exact algorithm for n < 1290 without ties, so small-sample p-values differ.",
    "kendalltau computes tau-b (tie-adjusted) by default; method='auto' is exact for small samples without ties, as in R.",
    "No CI for Spearman/Kendall: use scipy.stats.bootstrap (see bootstrap-ci).",
]
see_also = ["bootstrap-ci", "lin-ccc"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.pearsonr.html"

[[entry]]
id = "normality-tests"
title = "Normality tests: Shapiro-Wilk and D'Agostino-Pearson"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.shapiro(x) / stats.normaltest(x)"
aliases = ["shapiro wilk", "shapiro test", "test for normality", "is my data normal", "normality check", "dagostino pearson", "omnibus normality test", "lilliefors"]
r = ["shapiro.test", "nortest::lillie.test", "fBasics::dagoTest"]
inputs = "One 1-D array."
returns = "Result with .statistic and .pvalue."
example = '''
import numpy as np
from scipy import stats

rng = np.random.default_rng(27)
normal_sample = rng.normal(50, 10, 60)
skewed_sample = rng.lognormal(3, 0.8, 60)

for name, sample in [("normal", normal_sample), ("skewed", skewed_sample)]:
    sw = stats.shapiro(sample)
    dp = stats.normaltest(sample)
    print(f"{name}: Shapiro W = {sw.statistic:.3f}, p = {sw.pvalue:.4f};  D'Agostino p = {dp.pvalue:.4f}")
assert stats.shapiro(skewed_sample).pvalue < 0.05
'''
caveats = [
    "shapiro uses the same Royston algorithm as R's shapiro.test; results match.",
    "normaltest (skewness + kurtosis) needs n >= 8 and is unreliable below ~20.",
    "Do NOT use stats.kstest(x, 'norm') with mean/sd estimated from x; that is Lilliefors: statsmodels.stats.diagnostic.lilliefors(x).",
    "With large n tiny departures become 'significant'; look at a Q-Q plot (see qqplot).",
]
see_also = ["qqplot", "ks-test", "equal-variance-tests"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.shapiro.html"

