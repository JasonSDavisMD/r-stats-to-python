[[entry]]
id = "proportions-ztest"
title = "z-test for one or two proportions"
kind = "fit"
library = "statsmodels"
import = "from statsmodels.stats.proportion import proportions_ztest"
call = "proportions_ztest(count=[x1, x2], nobs=[n1, n2])"
aliases = ["two proportion z test", "compare two proportions", "difference in proportions test", "proportion test", "prop test", "rates comparison"]
r = ["prop.test"]
inputs = "count: successes (scalar or per group); nobs: trials; value: null proportion for one sample."
returns = "Tuple (z statistic, p-value)."
example = '''
import numpy as np
from scipy import stats
from statsmodels.stats.proportion import proportions_ztest

complications = np.array([18, 30])
patients = np.array([120, 115])
z_stat, p_value = proportions_ztest(count=complications, nobs=patients)
print("z =", round(z_stat, 3), " p =", round(p_value, 4))

# z^2 equals the uncorrected chi-square; R's prop.test default adds Yates correction
table = np.column_stack([complications, patients - complications])
chi2_plain = stats.chi2_contingency(table, correction=False)
print("prop.test(correct = TRUE) p =", round(stats.chi2_contingency(table).pvalue, 4))
assert np.isclose(z_stat ** 2, chi2_plain.statistic)
'''
caveats = [
    "No continuity correction: matches prop.test(correct = FALSE). R's default prop.test applies Yates; reproduce it with stats.chi2_contingency(table) (correction=True).",
    "Returns a plain tuple, not a result object. CIs for each proportion: proportion_confint; for the difference: statsmodels.stats.proportion.confint_proportions_2indep.",
    "Variance uses the pooled proportion by default (prop_var=False), as in the chi-square test.",
]
see_also = ["binomtest", "chi2-contingency", "power-analysis"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.stats.proportion.proportions_ztest.html"

[[entry]]
id = "multipletests"
title = "Multiple-testing correction: Bonferroni, Holm, Benjamini-Hochberg FDR"
kind = "evaluate"
library = "statsmodels"
import = "from statsmodels.stats.multitest import multipletests"
call = "multipletests(pvalues, alpha=0.05, method='holm')"
aliases = ["adjust p values", "p value adjustment", "bonferroni correction", "holm correction", "false discovery rate", "fdr", "benjamini hochberg", "bh correction", "multiple comparisons correction", "q values"]
r = ["p.adjust"]
inputs = "Array of raw p-values; method name ('bonferroni', 'holm', 'fdr_bh', 'fdr_by', 'hommel', ...)."
returns = "Tuple (reject: bool array, pvals_corrected, alphacSidak, alphacBonf)."
example = '''
import numpy as np
from statsmodels.stats.multitest import multipletests

raw_p = np.array([0.001, 0.008, 0.012, 0.040, 0.20, 0.64])
for method in ["bonferroni", "holm", "fdr_bh"]:
    reject, adjusted, _, _ = multipletests(raw_p, alpha=0.05, method=method)
    print(f"{method:>10}:", adjusted.round(4), reject)

bonf = multipletests(raw_p, method="bonferroni")[1]
assert np.allclose(bonf, np.minimum(raw_p * raw_p.size, 1))
'''
caveats = [
    "The DEFAULT method is 'hs' (Holm-Sidak), NOT Holm. R's p.adjust defaults to 'holm'. Always pass method explicitly.",
    "Method names differ: R 'BH'/'fdr' -> 'fdr_bh'; R 'BY' -> 'fdr_by'.",
    "Returns a 4-tuple; the adjusted p-values are element [1]. scipy.stats.false_discovery_control(p) is a one-line BH alternative.",
]
see_also = ["tukey-hsd", "kruskal-wallis"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.stats.multitest.multipletests.html"

