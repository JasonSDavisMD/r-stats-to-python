id = "bootstrap-ci"
title = "Bootstrap confidence interval for any statistic"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.bootstrap((x,), np.median, n_resamples=9999, method='BCa', rng=rng)"
aliases = ["bootstrap", "bootstrap confidence interval", "resampling confidence interval", "bca interval", "percentile bootstrap", "ci for median"]
r = ["boot::boot", "boot::boot.ci"]
inputs = "data: a TUPLE of arrays (even for one sample); statistic(*samples, axis) function."
returns = "BootstrapResult: .confidence_interval (low, high), .standard_error, .bootstrap_distribution."
example = '''
import numpy as np
from scipy import stats

rng = np.random.default_rng(30)
length_of_stay = rng.lognormal(1.5, 0.6, 50)

result = stats.bootstrap((length_of_stay,), np.median, n_resamples=4999,
                         confidence_level=0.95, method="BCa", rng=rng)
print("median =", round(np.median(length_of_stay), 2))
print("BCa 95% CI:", result.confidence_interval, " SE:", round(result.standard_error, 3))

# Paired two-sample statistic: pass both arrays and paired=True
ci = result.confidence_interval
assert ci.low < np.median(length_of_stay) < ci.high
'''
caveats = [
    "data must be a sequence of samples: (x,) not x.",
    "Default method='BCa' (like boot.ci type = 'bca'); also 'percentile' and 'basic'. R's boot.ci returns several types at once.",
    "Seed with rng=np.random.default_rng(seed); random_state is the legacy name.",
    "statistic should accept an axis argument for speed (NumPy reductions do). For custom functions set vectorized=False.",
]
see_also = ["permutation-test", "auc-bootstrap-ci", "correlation-test"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.bootstrap.html"

[[entry]]
id = "permutation-test"
title = "Permutation (randomization) test for any statistic"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.permutation_test((x, y), statistic, permutation_type='independent', rng=rng)"
aliases = ["permutation test", "randomization test", "exact permutation", "shuffle test", "resampling p value", "monte carlo p value"]
r = ["coin::oneway_test", "perm::permTS", "coin::independence_test"]
inputs = "data: tuple of samples; statistic(*samples, axis) -> number; permutation_type 'independent' | 'samples' (paired) | 'pairings' (correlation)."
returns = "PermutationTestResult: .statistic, .pvalue, .null_distribution."
example = '''
import numpy as np
from scipy import stats

rng = np.random.default_rng(31)
treated = rng.normal(5.8, 1.5, 20)
control = rng.normal(5.0, 1.5, 22)

def mean_difference(x, y, axis):
    return np.mean(x, axis=axis) - np.mean(y, axis=axis)

result = stats.permutation_test((treated, control), mean_difference, vectorized=True,
                                n_resamples=9999, alternative="two-sided", rng=rng)
print("diff =", round(result.statistic, 3), " permutation p =", round(result.pvalue, 4))
assert np.isclose(result.statistic, treated.mean() - control.mean())
'''
caveats = [
    "permutation_type: 'independent' for two groups, 'samples' for paired data (sign flips), 'pairings' for correlation.",
    "If the number of distinct permutations is <= n_resamples an EXACT test is done; otherwise Monte Carlo (seed with rng).",
    "vectorized=True requires the statistic to take an axis argument.",
]
see_also = ["bootstrap-ci", "mann-whitney", "ttest"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.permutation_test.html"

[[entry]]
id = "power-analysis"
title = "Power and sample size for a two-sample t-test or two proportions"
kind = "evaluate"
library = "statsmodels"
import = "from statsmodels.stats.power import TTestIndPower, NormalIndPower\nfrom statsmodels.stats.proportion import proportion_effectsize"
call = "TTestIndPower().solve_power(effect_size=d, alpha=0.05, power=0.8, ratio=1.0)"
aliases = ["sample size calculation", "power calculation", "how many patients", "power analysis t test", "sample size two proportions", "cohen d power", "cohen h"]
r = ["pwr::pwr.t.test", "pwr::pwr.2p.test", "power.t.test", "power.prop.test"]
inputs = "Leave exactly ONE of effect_size, nobs1, alpha, power as None; it is solved for."
returns = "The missing quantity (float). nobs1 = size of group 1; group 2 = nobs1 * ratio."
example = '''
import math
from statsmodels.stats.power import TTestIndPower, NormalIndPower
from statsmodels.stats.proportion import proportion_effectsize

n_per_group = TTestIndPower().solve_power(effect_size=0.5, alpha=0.05, power=0.80, ratio=1.0)
print("t-test, d = 0.5: n per group =", math.ceil(n_per_group))      # 64, like pwr.t.test

power_at_40 = TTestIndPower().solve_power(effect_size=0.5, nobs1=40, alpha=0.05)
print("power with 40 per group =", round(power_at_40, 3))

cohen_h = proportion_effectsize(0.30, 0.15)
n_props = NormalIndPower().solve_power(effect_size=cohen_h, alpha=0.05, power=0.80)
print("proportions 30% vs 15%: n per group =", math.ceil(n_props))     # pwr.2p.test
assert math.ceil(n_per_group) == 64
'''
caveats = [
    "effect_size is standardized (Cohen's d for TTestIndPower; Cohen's h = proportion_effectsize(p1, p2) for NormalIndPower), not a raw difference as in power.t.test(delta, sd).",
    "nobs1 is group 1's size; ratio = n2/n1. Round UP.",
    "alternative is 'two-sided' / 'larger' / 'smaller' (R: 'two.sided', 'greater', 'less').",
    "power.prop.test uses a different (non-arcsine) formula than pwr.2p.test; NormalIndPower + Cohen's h matches pwr.2p.test.",
]
see_also = ["ttest", "proportions-ztest"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.stats.power.TTestIndPower.html"
