# Topic: hypothesis_tests -- nonparametric, ANOVA, contingency, correlation, resampling and power (SciPy, statsmodels).
# Key distinction: the test is fit to data (kind = fit); check each default (continuity correction, exact vs asymptotic, p-adjust method) against R's before comparing p-values.
# Schema and how to add entries: docs/adding-a-topic.md

[[entry]]
id = "mann-whitney"
title = "Mann-Whitney U / Wilcoxon rank-sum test (two independent samples)"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.mannwhitneyu(x, y, alternative='two-sided', method='auto')"
aliases = ["wilcoxon rank sum", "wilcoxon rank-sum test", "mann whitney", "u test", "mann-whitney u", "nonparametric two sample test", "compare two medians", "rank sum test", "nonparametric t test alternative"]
r = ["wilcox.test", "wilcox.test(x, y)"]
inputs = "Two 1-D arrays of independent observations (ordinal or continuous)."
returns = "Result with .statistic (U for the FIRST sample, equals R's W) and .pvalue."
example = '''
import numpy as np
from scipy import stats

rng = np.random.default_rng(21)
pain_drug = rng.normal(3.0, 1.2, 18).round(1)
pain_placebo = rng.normal(4.2, 1.2, 20).round(1)

result = stats.mannwhitneyu(pain_drug, pain_placebo, alternative="two-sided")
print("U =", result.statistic, " p =", round(result.pvalue, 4))

# U(x) + U(y) = n_x * n_y
u_other = stats.mannwhitneyu(pain_placebo, pain_drug).statistic
assert result.statistic + u_other == len(pain_drug) * len(pain_placebo)
'''
caveats = [
    "The statistic is U for the first sample, the same number R prints as W.",
    "Exact vs asymptotic differs from R: SciPy's method='auto' is exact only when one sample has <= 8 values and there are no ties; R's wilcox.test is exact for n < 50 without ties. Pass method='exact' (no ties) to reproduce R's p-value.",
    "Continuity correction: use_continuity=True by default, like R's correct = TRUE.",
    "alternative uses 'two-sided' / 'less' / 'greater' (R: 'two.sided'). SciPy gives no Hodges-Lehmann shift estimate or CI (R's conf.int = TRUE).",
    "For PAIRED data use wilcoxon-signed-rank instead.",
]
see_also = ["wilcoxon-signed-rank", "kruskal-wallis", "ttest", "permutation-test"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.mannwhitneyu.html"

[[entry]]
id = "wilcoxon-signed-rank"
title = "Wilcoxon signed-rank test (paired samples or one sample vs 0)"
kind = "fit"
library = "SciPy"
import = "from scipy import stats"
call = "stats.wilcoxon(after, before, alternative='two-sided')"
aliases = ["signed rank test", "paired wilcoxon", "wilcoxon paired", "nonparametric paired test", "paired nonparametric", "before after nonparametric", "paired t test alternative"]
r = ["wilcox.test(x, y, paired = TRUE)", "wilcox.test(paired = TRUE)"]
inputs = "Two paired arrays of equal length, or one array of differences."
returns = "Result with .statistic (smaller of the signed-rank sums for two-sided) and .pvalue."
example = '''
import numpy as np
from scipy import stats

rng = np.random.default_rng(22)
before = rng.normal(140, 12, 15).round()
after = before - rng.normal(6, 8, 15).round()

result = stats.wilcoxon(after, before, alternative="two-sided")
print("T =", result.statistic, " p =", round(result.pvalue, 4))

# Same test on the differences directly
assert np.isclose(stats.wilcoxon(after - before).pvalue, result.pvalue)
'''
caveats = [
    "Statistic differs from R: for two-sided SciPy reports min(V+, V-); R reports V = sum of positive ranks. p-values agree.",
    "correction=False by default in SciPy; R uses correct = TRUE when it falls back to the normal approximation.",
    "method='auto' is exact for n <= 50 without ties/zeros (like R). With ties or zeros SciPy permutes when n <= 13, else normal approximation.",
    "Zero differences are dropped (zero_method='wilcox'), the same as R.",
]
see_also = ["mann-whitney", "ttest", "permutation-test"]
docs = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.wilcoxon.html"

