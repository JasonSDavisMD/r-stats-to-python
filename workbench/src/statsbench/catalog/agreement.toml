# Topic: agreement -- inter-rater reliability, method comparison and diagnostic accuracy (clinical measurement).
# Key distinction: agreement (kappa, ICC, Bland-Altman, CCC) asks "do two measurements give the SAME value?"; correlation only asks "do they move together?".
# Schema and how to add entries: docs/adding-a-topic.md

[[entry]]
id = "cohen-kappa"
title = "Cohen's kappa for two raters, unweighted or weighted (linear / quadratic)"
kind = "evaluate"
library = "scikit-learn"
import = "from sklearn.metrics import cohen_kappa_score"
call = "cohen_kappa_score(rater1, rater2, weights=None | 'linear' | 'quadratic')"
aliases = ["cohen kappa", "cohens kappa", "weighted kappa", "inter rater agreement two raters", "interrater reliability categorical", "kappa statistic", "quadratic weighted kappa", "linear weighted kappa", "reader agreement", "chance corrected agreement"]
r = ["irr::kappa2", "psych::cohen.kappa", "vcd::Kappa"]
inputs = "Two equal-length arrays of category labels (one per rater, same subjects). labels= fixes the ordered category list."
returns = "Kappa as a float (no CI or p-value)."
example = '''
import numpy as np
from sklearn.metrics import cohen_kappa_score, confusion_matrix
from statsmodels.stats.inter_rater import cohens_kappa

rng = np.random.default_rng(41)
# BI-RADS-like ordinal scores (1-5) from two radiologists on 80 lesions
reader_a = rng.integers(1, 6, 80)
reader_b = np.clip(reader_a + rng.choice([-1, 0, 0, 0, 1], 80), 1, 5)
categories = [1, 2, 3, 4, 5]

kappa = cohen_kappa_score(reader_a, reader_b, labels=categories)
kappa_linear = cohen_kappa_score(reader_a, reader_b, labels=categories, weights="linear")
kappa_quadratic = cohen_kappa_score(reader_a, reader_b, labels=categories, weights="quadratic")
print(f"unweighted {kappa:.3f}  linear {kappa_linear:.3f}  quadratic {kappa_quadratic:.3f}")

# Hand check of unweighted kappa: (p_observed - p_chance) / (1 - p_chance)
table = confusion_matrix(reader_a, reader_b, labels=categories)
p_observed = np.trace(table) / table.sum()
p_chance = (table.sum(0) * table.sum(1)).sum() / table.sum() ** 2
assert np.isclose(kappa, (p_observed - p_chance) / (1 - p_chance))

# Standard error and 95% CI (statsmodels, from the table)
result = cohens_kappa(table)
print("kappa 95% CI:", round(result.kappa_low, 3), round(result.kappa_upp, 3))
'''
caveats = [
    "Weight names differ from R: irr::kappa2 weight = 'equal' -> weights='linear'; weight = 'squared' -> weights='quadratic'.",
    "Weights use the POSITION of each label in the sorted label list, not numeric distance. Pass labels=[...] so unused categories still count.",
    "No CI or p-value from sklearn. statsmodels.stats.inter_rater.cohens_kappa(table, wt='linear'|'quadratic') returns kappa with SE and CI from a square table.",
    "For 3+ raters use fleiss-kappa; for continuous measurements use intraclass-corr.",
]
see_also = ["fleiss-kappa", "intraclass-corr", "confusion-matrix", "mcnemar"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.metrics.cohen_kappa_score.html"

[[entry]]
id = "fleiss-kappa"
title = "Fleiss' kappa for three or more raters (categorical ratings)"
kind = "evaluate"
library = "statsmodels"
import = "from statsmodels.stats.inter_rater import fleiss_kappa, aggregate_raters"
call = "fleiss_kappa(aggregate_raters(ratings)[0], method='fleiss')"
aliases = ["fleiss kappa", "multi rater kappa", "kappa more than two raters", "agreement among many raters", "multirater agreement", "inter rater reliability multiple raters"]
r = ["irr::kappam.fleiss", "psych::fleiss"]
inputs = "ratings: (n_subjects, n_raters) array of category codes; aggregate_raters turns it into a (n_subjects, n_categories) count table."
returns = "Kappa as a float (no SE/CI)."
example = '''
import numpy as np
from statsmodels.stats.inter_rater import fleiss_kappa, aggregate_raters

rng = np.random.default_rng(42)
true_grade = rng.integers(0, 3, 50)               # 50 scans, 3 categories
noise = rng.random((50, 4)) < 0.25                # 4 raters, each errs 25% of the time
ratings = np.where(noise, rng.integers(0, 3, (50, 4)), true_grade[:, None])

count_table, categories = aggregate_raters(ratings)
print(count_table[:3], categories)
kappa = fleiss_kappa(count_table, method="fleiss")
print("Fleiss kappa =", round(kappa, 3))

perfect = aggregate_raters(np.repeat(true_grade[:, None], 4, axis=1))[0]
assert np.isclose(fleiss_kappa(perfect), 1.0)
'''
caveats = [
    "fleiss_kappa expects the SUBJECT x CATEGORY count table, not the raw subject x rater matrix. Convert with aggregate_raters(ratings)[0].",
    "Raters need not be the same people for each subject (Fleiss' assumption); each subject needs the same number of ratings.",
    "method='randolph' gives the free-marginal kappa. irr::kappam.fleiss(detail = TRUE) also reports a z test; statsmodels does not.",
]
see_also = ["cohen-kappa", "intraclass-corr"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.stats.inter_rater.fleiss_kappa.html"

[[entry]]
id = "bland-altman"
title = "Bland-Altman plot, bias and 95% limits of agreement"
kind = "visualize"
library = "statsmodels"
import = "import matplotlib.pyplot as plt\nfrom statsmodels.graphics.agreement import mean_diff_plot"
call = "mean_diff_plot(method1, method2, sd_limit=1.96, ax=ax)"
aliases = ["bland altman", "bland-altman plot", "limits of agreement", "mean difference plot", "tukey mean difference plot", "method comparison", "agreement between two measurement methods", "bias and loa"]
r = ["BlandAltmanLeh::bland.altman.plot", "BlandAltmanLeh::bland.altman.stats", "blandr::blandr.draw"]
inputs = "Two equal-length arrays of paired measurements of the same subjects (same units)."
returns = "Matplotlib Figure. Difference plotted is method1 - method2 against their mean."
example = '''
import numpy as np
import matplotlib.pyplot as plt
from statsmodels.graphics.agreement import mean_diff_plot

rng = np.random.default_rng(43)
true_volume = rng.uniform(20, 120, 60)                     # e.g. lesion volume in mL
manual = true_volume + rng.normal(0, 4, 60)
automatic = true_volume + 2.0 + rng.normal(0, 4, 60)       # software over-reads by ~2 mL

fig, ax = plt.subplots(figsize=(6, 4))
mean_diff_plot(manual, automatic, sd_limit=1.96, ax=ax)
ax.set_xlabel("Mean of manual and automatic (mL)")
ax.set_ylabel("Manual - automatic (mL)")

# Numbers by hand (what BlandAltmanLeh::bland.altman.stats reports)
difference = manual - automatic
bias = difference.mean()
sd_diff = difference.std(ddof=1)
lower_loa, upper_loa = bias - 1.96 * sd_diff, bias + 1.96 * sd_diff
print(f"bias = {bias:.2f}, 95% LoA = [{lower_loa:.2f}, {upper_loa:.2f}]")
inside = np.mean((difference >= lower_loa) & (difference <= upper_loa))
print("share of points inside LoA:", round(inside, 3))
assert inside > 0.85
plt.close(fig)
'''
caveats = [
    "Difference is method1 - method2; swapping the arguments flips the sign of the bias. Pick the order you want reported.",
    "SD of the differences should use ddof=1 (NumPy's std defaults to ddof=0, R's sd uses n - 1).",
    "The plot has no CIs for bias/LoA. Compute them by hand: SE(bias) = sd/sqrt(n); SE(LoA) ~ sd*sqrt(3/n) (Bland & Altman 1999).",
    "If the spread grows with the mean, analyse log-transformed values or percentage differences.",
    "Pearson correlation is NOT agreement; see lin-ccc for a single-number agreement index.",
]
see_also = ["lin-ccc", "intraclass-corr", "plt-subplots"]
docs = "https://www.statsmodels.org/stable/generated/statsmodels.graphics.agreement.mean_diff_plot.html"

[[entry]]
id = "intraclass-corr"
title = "Intraclass correlation coefficient (ICC) for reliability of continuous ratings"
kind = "fit"
library = "pingouin"
import = "import pingouin as pg"
call = "pg.intraclass_corr(data=long_df, targets='subject', raters='rater', ratings='score')"
aliases = ["icc", "intraclass correlation", "inter rater reliability continuous", "test retest reliability", "interobserver reliability", "intraobserver reliability", "icc2", "icc3", "icc(2,1)", "icc(3,1)", "absolute agreement icc", "consistency icc"]
r = ["irr::icc", "psych::ICC"]
inputs = "Long-format DataFrame: one row per (subject, rater) with a numeric score. Complete design (every rater scores every subject)."
returns = "DataFrame, one row per ICC type: Type, ICC, F, df1, df2, pval, CI95."
example = '''
import numpy as np
import pandas as pd
import pingouin as pg

rng = np.random.default_rng(44)
n_subjects, rater_names = 30, ["R1", "R2", "R3"]
true_size = rng.normal(25, 6, n_subjects)
rater_bias = {"R1": 0.0, "R2": 1.5, "R3": -0.5}
long_df = pd.DataFrame([
    {"subject": s, "rater": r, "score": true_size[s] + rater_bias[r] + rng.normal(0, 2)}
    for s in range(n_subjects) for r in rater_names
])

icc_table = pg.intraclass_corr(data=long_df, targets="subject", raters="rater", ratings="score")
print(icc_table[["Type", "ICC", "CI95"]])

# Hand check from two-way ANOVA mean squares (McGraw & Wong)
wide = long_df.pivot(index="subject", columns="rater", values="score").to_numpy()
n, k = wide.shape
grand = wide.mean()
ms_rows = k * ((wide.mean(1) - grand) ** 2).sum() / (n - 1)
ms_cols = n * ((wide.mean(0) - grand) ** 2).sum() / (k - 1)
ss_error = ((wide - wide.mean(1, keepdims=True) - wide.mean(0) + grand) ** 2).sum()
ms_error = ss_error / ((n - 1) * (k - 1))
icc_consistency = (ms_rows - ms_error) / (ms_rows + (k - 1) * ms_error)
icc_agreement = (ms_rows - ms_error) / (ms_rows + (k - 1) * ms_error + k * (ms_cols - ms_error) / n)
by_type = icc_table.set_index("Type")["ICC"]
assert np.isclose(by_type["ICC(C,1)"], icc_consistency)
assert np.isclose(by_type["ICC(A,1)"], icc_agreement)
'''
caveats = [
    "Requires the optional pingouin package: uv sync --extra stats-extra.",
    "pingouin 0.7 labels types in McGraw & Wong notation: ICC(1,1), ICC(A,1), ICC(C,1), ICC(1,k), ICC(A,k), ICC(C,k). Older pingouin and psych::ICC use Shrout-Fleiss names: ICC1 = ICC(1,1), ICC2 = ICC(A,1), ICC3 = ICC(C,1), and ICC1k/ICC2k/ICC3k for the averaged versions.",
    "irr::icc(model = 'twoway', type = 'agreement', unit = 'single') = ICC(A,1) (Shrout-Fleiss ICC2); type = 'consistency' = ICC(C,1) (ICC3); model = 'oneway' = ICC(1,1).",
    "Choose absolute agreement ICC(A,1) when raters must give the SAME value (typical for measurement studies); consistency ICC(C,1) ignores a constant offset between raters. Report the type, not just 'ICC'.",
    "Missing ratings raise by default; nan_policy='omit' drops whole subjects (listwise), unlike mixed-model ICCs.",
    "Data must be LONG format (DataFrame.melt converts wide subject x rater tables).",
]
see_also = ["cohen-kappa", "bland-altman", "lin-ccc", "fleiss-kappa"]
docs = "https://pingouin-stats.org/build/html/generated/pingouin.intraclass_corr.html"
requires = ["pingouin"]
extra = "stats-extra"

