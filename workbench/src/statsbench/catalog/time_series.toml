[[entry]]
id = "time-series-split"
title = "Cross-validation folds and hold-out for time series in time order (no shuffling)"
kind = "evaluate"
library = "scikit-learn"
import = "from sklearn.model_selection import TimeSeriesSplit"
call = "TimeSeriesSplit(n_splits=5, test_size=12, gap=0).split(X)"
aliases = ["time series cross validation", "time series split", "rolling origin", "walk forward validation", "expanding window cv", "backtesting", "tscv", "no shuffle split"]
r = ["forecast::tsCV", "rsample::rolling_origin", "window", "caret::createTimeSlices"]
inputs = "X (n, ...) in time order; n_splits; optional test_size, gap (samples dropped between train and test), max_train_size (sliding instead of expanding window)."
returns = "Generator of (train_indices, test_indices); every train index precedes every test index. Also usable as cv= in cross_val_score / GridSearchCV."
example = '''
import numpy as np
from sklearn.linear_model import Ridge
from sklearn.model_selection import TimeSeriesSplit, cross_val_score

rng = np.random.default_rng(39)
n = 120
signal = np.sin(np.arange(n) / 6) + rng.normal(scale=0.2, size=n)
lagged_features = np.column_stack([np.roll(signal, 1), np.roll(signal, 2)])[2:]
target = signal[2:]

splitter = TimeSeriesSplit(n_splits=4, test_size=12)
for fold, (train_idx, test_idx) in enumerate(splitter.split(lagged_features)):
    print(f"fold {fold}: train 0..{train_idx[-1]}  test {test_idx[0]}..{test_idx[-1]}")
    assert train_idx.max() < test_idx.min()               # never trains on the future

scores = cross_val_score(Ridge(alpha=1.0), lagged_features, target, cv=splitter, scoring="neg_mean_squared_error")
print("MSE per fold:", (-scores).round(3))

# a single chronological hold-out: slice, do NOT use train_test_split(shuffle=True)
split_point = int(len(target) * 0.8)
X_train, X_test = lagged_features[:split_point], lagged_features[split_point:]
'''
caveats = [
    "Rows must already be sorted by time; TimeSeriesSplit only uses row order, not dates.",
    "Default is an EXPANDING training window (like tsCV / rolling_origin(cumulative = TRUE)); set max_train_size for a fixed-length sliding window.",
    "sklearn's train_test_split shuffles by default -- for a single hold-out use train_test_split(..., shuffle=False) or plain slicing.",
    "gap=k drops k samples between train and test to avoid leakage from lagged features.",
]
see_also = ["cross-val-score", "train-test-split", "arima"]
docs = "https://scikit-learn.org/stable/modules/generated/sklearn.model_selection.TimeSeriesSplit.html"
