# pyproject.toml -- YOUR private workspace. It is not a package; it only
# declares which tools your notebooks use. `uv sync --group lab` builds .venv.
#
# statsbench (the public toolkit: `stats find`, catalog, recipes) is installed
# straight from GitHub. uv.lock records the exact commit, so your results stay
# reproducible until you choose to update:   uv lock --upgrade-package statsbench
#
# Optional add-ons: change the dependency to e.g. "statsbench[deep,bayes]"
# (deep = PyTorch, bayes = PyMC/ArviZ, ml = XGBoost/LightGBM,
#  stats-extra = pingouin/lifelines, all = everything), then run `uv sync --group lab`.

[project]
name = "my-stats-work"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "statsbench",
]

[tool.uv]
package = false   # a workspace of notebooks, not an installable package

[tool.uv.sources]
statsbench = { git = "https://github.com/JasonSDavisMD/r-stats-to-python", subdirectory = "workbench", branch = "main" }

[dependency-groups]
lab = ["jupyterlab>=4.2", "jupytext>=1.16", "jupyterlab-git>=0.50"]
